    "images/english/business-email-and-professional-correspondence-basics.png";
const ENGLISH_BUSINESS_EMAIL_BUBBLE_IMAGE_ID =
    "business-email-and-professional-correspondence-basics";
const ENGLISH_BUSINESS_EMAIL_BUBBLE_TEXT = Object.freeze({
    1: "I am writing to inquire about the availability of your products.",
    2: "Could you please provide me with the updated price list?",
    3: "Thank you for your prompt response.",
    4: "I look forward to hearing from you."
});

function getEnglishBusinessEmailBubblePanels(record, assetFile) {
    if (assetFile !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE ||
        typeof imageTTSData === "undefined" || !imageTTSData || typeof imageTTSData !== "object") {
        return null;
    }

    const sourceRecord = imageTTSData[ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE];
    const matchingKeys = Object.keys(imageTTSData).filter(key => {
        const candidate = imageTTSData[key];
        return candidate && candidate.imageId === ENGLISH_BUSINESS_EMAIL_BUBBLE_IMAGE_ID &&
            candidate.assetFile === ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE;
    });
    if (!record || !sourceRecord || matchingKeys.length !== 1 ||
        matchingKeys[0] !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE ||
        record.imageId !== ENGLISH_BUSINESS_EMAIL_BUBBLE_IMAGE_ID ||
        record.assetFile !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE ||
        sourceRecord.imageId !== ENGLISH_BUSINESS_EMAIL_BUBBLE_IMAGE_ID ||
        sourceRecord.assetFile !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE ||
        (record.contentType !== undefined && record.contentType !== "business-email") ||
        record.layout !== "2x2" || !Array.isArray(record.panels) || record.panels.length !== 4 ||
        !Array.isArray(sourceRecord.panels) || sourceRecord.panels.length !== 4) {
        return null;
    }

    const hasExactKeys = (value, keys) => value && typeof value === "object" && !Array.isArray(value) &&
        Object.keys(value).length === keys.length && keys.every(key => Object.prototype.hasOwnProperty.call(value, key));
    const isValidBounds = bounds => bounds &&
        [bounds.xPct, bounds.yPct, bounds.widthPct, bounds.heightPct].every(value =>
            Number.isFinite(value) && value >= 0 && value <= 100) &&
        bounds.widthPct > 0 && bounds.heightPct > 0 &&
        bounds.xPct + bounds.widthPct <= 100 && bounds.yPct + bounds.heightPct <= 100;
    const panels = record.panels.slice().sort((left, right) => left.readingOrder - right.readingOrder);
    const bubbles = [];

    for (let index = 0; index < panels.length; index += 1) {
        const panel = panels[index];
        const sourcePanel = sourceRecord.panels.find(candidate => candidate && candidate.panelId === index + 1);
        const bubbleSpeech = panel && panel.bubbleSpeech;
        const region = bubbleSpeech && bubbleSpeech.tapRegion;
        const expectedText = ENGLISH_BUSINESS_EMAIL_BUBBLE_TEXT[index + 1];
        if (!panel || panel.panelId !== index + 1 || panel.readingOrder !== index + 1 ||
            !sourcePanel || panel !== sourcePanel || !isValidBounds(panel.bounds) ||
            !hasExactKeys(bubbleSpeech, ["sourceText", "ttsText", "tapRegion", "tapRegionStatus"]) ||
            bubbleSpeech.sourceText !== expectedText || bubbleSpeech.ttsText !== expectedText ||
            bubbleSpeech.sourceText !== bubbleSpeech.ttsText ||
            !getEnglishTTSUnitText(bubbleSpeech.sourceText) || !getEnglishTTSUnitText(bubbleSpeech.ttsText) ||
            bubbleSpeech.tapRegionStatus !== "visual-estimate-pending-device-calibration" ||
            !hasExactKeys(region, ["xPct", "yPct", "widthPct", "heightPct"]) || !isValidBounds(region) ||
            region.xPct < panel.bounds.xPct || region.yPct < panel.bounds.yPct ||
            region.xPct + region.widthPct > panel.bounds.xPct + panel.bounds.widthPct ||
            region.yPct + region.heightPct > panel.bounds.yPct + panel.bounds.heightPct) {
            return null;
        }
        bubbles.push({ panel, bubbleSpeech });
    }

    for (let leftIndex = 0; leftIndex < bubbles.length; leftIndex += 1) {
        const left = bubbles[leftIndex].bubbleSpeech.tapRegion;
        for (let rightIndex = leftIndex + 1; rightIndex < bubbles.length; rightIndex += 1) {
            const right = bubbles[rightIndex].bubbleSpeech.tapRegion;
            if (left.xPct < right.xPct + right.widthPct &&
                left.xPct + left.widthPct > right.xPct &&
                left.yPct < right.yPct + right.heightPct &&
                left.yPct + left.heightPct > right.yPct) {
                return null;
            }
        }
    }
    return bubbles;
}

function getEnglishBusinessEmailStopPanel(trigger, wrapper) {
    if (!trigger || !wrapper || wrapper.isConnected === false ||
        wrapper.dataset.imageTtsAssetFile !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE ||
        typeof imageTTSData === "undefined" || !imageTTSData || typeof imageTTSData !== "object" ||
        typeof trigger.closest !== "function" ||
        trigger.closest(".image-tts-overlay-wrapper") !== wrapper) {
        return null;
    }

    const image = wrapper.querySelector("img");
    const record = imageTTSData[ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE];
    const matchingKeys = Object.keys(imageTTSData).filter(key => {
        const candidate = imageTTSData[key];
        return candidate && candidate.imageId === ENGLISH_BUSINESS_EMAIL_BUBBLE_IMAGE_ID &&
            candidate.assetFile === ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE;
    });
    const validatedBubbles = getEnglishBusinessEmailBubblePanels(
        record,
        ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE
    );
    if (!image || image.getAttribute("src") !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE ||
        !record || matchingKeys.length !== 1 || matchingKeys[0] !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE ||
        record.imageId !== ENGLISH_BUSINESS_EMAIL_BUBBLE_IMAGE_ID ||
        record.assetFile !== ENGLISH_BUSINESS_EMAIL_BUBBLE_ASSET_FILE || record.layout !== "2x2" ||
        !Array.isArray(record.panels) || record.panels.length !== 4 ||
        !Array.isArray(validatedBubbles) || validatedBubbles.length !== 4 ||
        !validatedBubbles.every(({ panel }, index) => panel && panel.panelId === index + 1 &&
            panel.readingOrder === index + 1)) {
        return null;
    }

    const panelId = Number(trigger.getAttribute("data-image-tts-panel-id"));
    if (!Number.isInteger(panelId) || panelId < 1 || panelId > 4 ||
        trigger.getAttribute("data-image-tts-panel-id") !== String(panelId)) {
        return null;
    }
    const panel = validatedBubbles[panelId - 1].panel;
    if (record.panels[panelId - 1] !== panel) {
        return null;
    }

    const speakers = Array.from(wrapper.querySelectorAll(".image-tts-panel-speaker"));
    const bubbleButtons = Array.from(wrapper.querySelectorAll(".image-tts-business-email-bubble-hit-area"));
    const panelSpeaker = speakers.find(candidate =>
        candidate.getAttribute("data-image-tts-panel-id") === String(panelId));
    const bubbleButton = bubbleButtons.find(candidate =>
        candidate.getAttribute("data-image-tts-panel-id") === String(panelId));
    if (speakers.length !== 4 || new Set(speakers.map(candidate =>
        candidate.getAttribute("data-image-tts-panel-id")).filter(Boolean)).size !== 4 ||
        bubbleButtons.length !== 4 || new Set(bubbleButtons.map(candidate =>
            candidate.getAttribute("data-image-tts-panel-id")).filter(Boolean)).size !== 4 ||
        !panelSpeaker || !bubbleButton) {
        return null;
    }

    const isBubbleTrigger = trigger.classList.contains("image-tts-business-email-bubble-hit-area");
    const isPanelSpeaker = trigger.classList.contains("image-tts-panel-speaker") &&
        !trigger.classList.contains("image-tts-dialogue-speaker");
    if (isBubbleTrigger) {
        if (trigger !== bubbleButton || trigger._englishImageTTSBubblePanel !== panel ||
            trigger._englishImageTTSBubbleSpeech !== validatedBubbles[panelId - 1].bubbleSpeech) {
            return null;
        }
    } else if (isPanelSpeaker) {
        const placement = trigger._englishImageTTSPlacement;
        const sameBounds = placement && placement.bounds &&
            ["xPct", "yPct", "widthPct", "heightPct"].every(key =>
                placement.bounds[key] === panel.bounds[key]);
        const sameAnchor = placement && placement.anchor &&
            ["xPct", "yPct"].every(key => placement.anchor[key] === panel.speakerAnchor[key]);
        if (trigger !== panelSpeaker || !sameBounds || !sameAnchor) {
            return null;
        }
    } else {
        return null;
    }

    const imageRect = image.getBoundingClientRect();
    const speakerRect = panelSpeaker.getBoundingClientRect();
    if (!imageRect || !imageRect.width || !imageRect.height ||
        !speakerRect || !speakerRect.width || !speakerRect.height) {
        return null;
    }
    const speakerBounds = {
        xPct: (speakerRect.left - imageRect.left) / imageRect.width * 100,
        yPct: (speakerRect.top - imageRect.top) / imageRect.height * 100,
        widthPct: speakerRect.width / imageRect.width * 100,
        heightPct: speakerRect.height / imageRect.height * 100
    };
    if (![speakerBounds.xPct, speakerBounds.yPct, speakerBounds.widthPct, speakerBounds.heightPct]
        .every(Number.isFinite) || speakerBounds.xPct < 0 || speakerBounds.yPct < 0 ||
        speakerBounds.widthPct <= 0 || speakerBounds.heightPct <= 0 ||
        speakerBounds.xPct + speakerBounds.widthPct > 100 ||
        speakerBounds.yPct + speakerBounds.heightPct > 100) {
        return null;
    }

    return {
        panelId: panel.panelId,
        bounds: panel.bounds,
        speechUnits: [
            { bounds: panel.bubbleSpeech.tapRegion },
            { bounds: speakerBounds }
        ]
    };
}

function createEnglishBusinessEmailBubbleHitArea(wrapper, panel, bubbleSpeech) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "image-tts-business-email-bubble-hit-area";
    button.textContent = "";
    button.hidden = true;
    button.disabled = isEnglishImageTTSDrawingMode();
    button.setAttribute("data-english-tts-control", "true");
    button.setAttribute("data-image-tts-panel-id", String(panel.panelId));

    button.setAttribute("aria-haspopup", "true");

    button._englishImageTTSBubblePanel = panel;
    button._englishImageTTSBubbleSpeech = bubbleSpeech;
    button._englishImageTTSBubbleRegion = { ...bubbleSpeech.tapRegion };
    button.addEventListener("click", event => {

function layoutEnglishBusinessEmailBubbleHitAreas(wrapper) {
    if (!wrapper) {
        return;
    }
    const buttons = Array.from(wrapper.querySelectorAll(".image-tts-business-email-bubble-hit-area"));
    if (!buttons.length) {
        return;
    }
    const hideAll = () => buttons.forEach(button => { button.hidden = true; });
    const image = wrapper.querySelector("img");
    const imageRect = image && image.getBoundingClientRect();
    const wrapperRect = wrapper.getBoundingClientRect();
    if (!image || !image.complete || image.naturalWidth <= 0 || !imageRect ||
        !imageRect.width || !imageRect.height || !wrapperRect.width || !wrapperRect.height) {
        hideAll();
        return;
    }

    const speakers = Array.from(wrapper.querySelectorAll(".image-tts-panel-speaker"));
    if (speakers.length !== 4 || speakers.some(button => button.hidden)) {
        hideAll();
        return;
    }
    const imageLeft = imageRect.left - wrapperRect.left;
    const imageTop = imageRect.top - wrapperRect.top;
    buttons.forEach(button => {
        const region = button._englishImageTTSBubbleRegion;
        if (!region) {
            button.hidden = true;
            return;
        }
        button.style.left = `${imageLeft + imageRect.width * region.xPct / 100}px`;
        button.style.top = `${imageTop + imageRect.height * region.yPct / 100}px`;
        button.style.width = `${imageRect.width * region.widthPct / 100}px`;
        button.style.height = `${imageRect.height * region.heightPct / 100}px`;
        button.hidden = false;
    });

    const speakerRects = speakers.map(button => button.getBoundingClientRect());
    const overlapsSpeaker = buttons.some(button => {
        if (button.hidden) {
            return true;
        }
        const rect = button.getBoundingClientRect();
        const clearance = 1;
        return speakerRects.some(speakerRect =>
            rect.left < speakerRect.right + clearance && rect.right > speakerRect.left - clearance &&
            rect.top < speakerRect.bottom + clearance && rect.bottom > speakerRect.top - clearance);
    });
    if (overlapsSpeaker) {
        hideAll();
    }
}

function enhanceEnglishImageTTSOverlays(responseRoot) {
    if (!responseRoot || typeof responseRoot.querySelectorAll !== "function") {
        return 0;
    }

    const images = Array.from(responseRoot.querySelectorAll("img"));
    let added = 0;
    images.forEach(image => {
        const wrapper = wrapEnglishImageForTTS(image);
        if (!wrapper) {
            return;
        }
        if (wrapper.dataset.englishImageTtsEnhanced === "true") {
            return;
        }
        wrapper.dataset.englishImageTtsEnhanced = "true";

        const assetFile = image.getAttribute("src");
        wrapper.dataset.imageTtsAssetFile = assetFile || "";
        if (appState.subjectMode !== "english" || !englishTTSState.supported || !assetFile) {
            return;
        }

        const record = getEnglishImageTTSRecord(assetFile);
        if (!record) {
            return;
        }

        if (record.contentType === "dialogue") {
            if (image.complete && image.naturalWidth === 0) {
                return;
            }
            if (record.panelInteraction === "tap-to-open-menu" ||
                record.panelInteraction === "tap-regions-to-open-menu") {
                const usesTapRegions = record.panelInteraction === "tap-regions-to-open-menu";
                const isP27TapBoundsInteraction = record.panelInteraction === "tap-to-open-menu" &&
                    record.imageId === "meeting-schedule-and-appointment-basics" &&
                    record.assetFile === "images/english/meeting-schedule-and-appointment-basics.png";
                record.panels.forEach(panel => {
                    if (isP27TapBoundsInteraction && panel.panelId === 1 &&
                        panel.speechUnits.length === 0 &&
                        !Object.prototype.hasOwnProperty.call(panel, "tapBounds")) {
                        return;
                    }
                    const regions = usesTapRegions ? panel.tapRegions : [null];
                    regions.forEach(region => {
                        createEnglishImageTTSDialoguePanelHitArea(wrapper, image, panel, region);
                        added += 1;
                    });
                });
                image.addEventListener("load", () => layoutEnglishImageTTSDialoguePanelHitAreas(wrapper), { once: true });
                image.addEventListener("error", () => {
                    wrapper.querySelectorAll(".image-tts-dialogue-panel-hit-area").forEach(button => {
                        button.hidden = true;
                    });
                    if (englishImageTTSOverlayState.activeTrigger &&
                        wrapper.contains(englishImageTTSOverlayState.activeTrigger)) {
                        closeEnglishImageTTSMenu();
                    }
                }, { once: true });
                layoutEnglishImageTTSDialoguePanelHitAreas(wrapper);
                return;
            }
            const dialoguePanels = record.panels.filter(panel => panel.speechUnits.length);
            dialoguePanels.forEach(panel => {
                createEnglishImageTTSDialogueSpeaker(wrapper, panel);
                added += 1;
            });
            if (!dialoguePanels.length) {
                return;
            }
            image.addEventListener("load", () => layoutEnglishImageTTSPanelSpeakers(wrapper), { once: true });
            image.addEventListener("error", () => {
                wrapper.querySelectorAll(".image-tts-dialogue-speaker").forEach(button => {
                    button.hidden = true;
                });
                wrapper.classList.remove("image-tts-dialogue-speaker-below");
                wrapper.classList.remove("image-tts-dialogue-speaker-below-narrow");
                wrapper.style.paddingBottom = "";
            }, { once: true });
            if (image.complete) {
                if (image.naturalWidth > 0) {
                    layoutEnglishImageTTSPanelSpeakers(wrapper);
                } else {
                    wrapper.querySelectorAll(".image-tts-dialogue-speaker").forEach(button => {
                        button.hidden = true;
                    });
                    wrapper.classList.remove("image-tts-dialogue-speaker-below");
                    wrapper.classList.remove("image-tts-dialogue-speaker-below-narrow");
                    wrapper.style.paddingBottom = "";
                }
            } else {
                scheduleEnglishImageTTSLayout();
            }
            return;
        }

        if (record.contentType === "story") {
            if (image.complete && image.naturalWidth === 0) {
                return;
            }
            const controls = createEnglishImageTTSStoryControls(wrapper, record);
            if (!controls) {
                return;
            }
            record.panels.forEach(panel => {
                createEnglishImageTTSStoryPanelHitArea(wrapper, panel, controls);
                added += 1;
            });
            image.addEventListener("error", () => {
                wrapper.querySelectorAll(".image-tts-story-panel-hit-area").forEach(button => {
                    button.hidden = true;
                });
                controls.hidden = true;
                if (englishImageTTSOverlayState.activeStoryControls === controls) {
                    closeEnglishImageTTSMenu();
                }
            }, { once: true });
            return;
        }

        const businessEmailBubbles = getEnglishBusinessEmailBubblePanels(record, assetFile);
        if (businessEmailBubbles) {
            businessEmailBubbles.forEach(({ panel, bubbleSpeech }) => {
                createEnglishBusinessEmailBubbleHitArea(wrapper, panel, bubbleSpeech);
                added += 1;
            });
        }
        record.panels.forEach(panel => {
            createEnglishImageTTSPanelSpeaker(wrapper, panel);
            added += 1;
        });

        image.addEventListener("load", () => layoutEnglishImageTTSPanelSpeakers(wrapper), { once: true });
        image.addEventListener("error", () => {
            wrapper.querySelectorAll(".image-tts-panel-speaker").forEach(button => {
                button.hidden = true;
            });
            wrapper.querySelectorAll(".image-tts-business-email-bubble-hit-area").forEach(button => {
                button.hidden = true;
            });
        }, { once: true });
        if (image.complete) {
            if (image.naturalWidth > 0) {
                layoutEnglishImageTTSPanelSpeakers(wrapper);
            } else {
                wrapper.querySelectorAll(".image-tts-panel-speaker, .image-tts-business-email-bubble-hit-area").forEach(button => {
                    button.hidden = true;
                });
            }
        } else {
            scheduleEnglishImageTTSLayout();
        }
    });

    syncEnglishImageTTSDrawingMode();
    return added;
}

function layoutEnglishImageTTSPanelSpeakers(wrapper) {
    if (!wrapper || !wrapper.isConnected) {
        return;
    }
    const image = wrapper.querySelector("img");
    if (!image) {
        return;
    }

    const imageRect = image.getBoundingClientRect();
    const wrapperRect = wrapper.getBoundingClientRect();
    layoutEnglishImageTTSDialoguePanelHitAreas(wrapper);
    if (!imageRect.width || !imageRect.height || !wrapperRect.width || !wrapperRect.height) {
        return;
    }

    const imageLeft = imageRect.left - wrapperRect.left;
    const imageTop = imageRect.top - wrapperRect.top;
    const dialogueButtons = Array.from(wrapper.querySelectorAll(".image-tts-dialogue-speaker"));
    const dialogueButtonIndexes = new Map(dialogueButtons.map((button, index) => [button, index]));
    wrapper.querySelectorAll(".image-tts-panel-speaker").forEach(button => {
        if (button._englishImageTTSDialoguePanel) {
            layoutEnglishImageTTSDialogueSpeaker(
                wrapper,
                imageRect,
                imageLeft,
                imageTop,
                button,
                dialogueButtonIndexes.get(button) || 0,
                dialogueButtons.length
            );
            return;
        }
        const placement = button._englishImageTTSPlacement;
        if (!placement) {
            button.hidden = true;
            return;
        }
        const buttonRect = button.getBoundingClientRect();
        const buttonWidth = buttonRect.width || 44;
        const buttonHeight = buttonRect.height || 44;
        const bounds = placement.bounds;
        const panelLeft = imageLeft + imageRect.width * bounds.xPct / 100;
        const panelTop = imageTop + imageRect.height * bounds.yPct / 100;
        const panelRight = panelLeft + imageRect.width * bounds.widthPct / 100;
        const panelBottom = panelTop + imageRect.height * bounds.heightPct / 100;

        if (panelRight - panelLeft < buttonWidth || panelBottom - panelTop < buttonHeight) {
            button.hidden = true;
            return;
        }

        const desiredLeft = imageLeft + imageRect.width * placement.anchor.xPct / 100 - buttonWidth / 2;
        const desiredTop = imageTop + imageRect.height * placement.anchor.yPct / 100 - buttonHeight / 2;
        const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), maximum);
        button.style.left = clamp(desiredLeft, panelLeft, panelRight - buttonWidth) + "px";
        button.style.top = clamp(desiredTop, panelTop, panelBottom - buttonHeight) + "px";
        button.style.transform = "none";
        button.hidden = false;
    });
    layoutEnglishBusinessEmailBubbleHitAreas(wrapper);
}

function layoutEnglishImageTTSDialogueSpeaker(wrapper, imageRect, imageLeft, imageTop, button, buttonIndex, buttonCount) {
    const buttonRect = button.getBoundingClientRect();
    const buttonWidth = buttonRect.width || 44;
    const buttonHeight = buttonRect.height || 44;
    const panel = button._englishImageTTSDialoguePanel;
    const placement = panel && panel.speakerButtonPlacement;
    if (placement && panel.bounds && Array.isArray(panel.speechUnits)) {
        const desiredLeft = imageLeft + imageRect.width * placement.anchor.xPct / 100 - buttonWidth / 2;
        const desiredTop = imageTop + imageRect.height * placement.anchor.yPct / 100 - buttonHeight / 2;
        const safeLeft = imageLeft + imageRect.width * placement.safeBounds.xPct / 100;
        const safeTop = imageTop + imageRect.height * placement.safeBounds.yPct / 100;
        const safeRight = safeLeft + imageRect.width * placement.safeBounds.widthPct / 100;
        const safeBottom = safeTop + imageRect.height * placement.safeBounds.heightPct / 100;
        const panelLeft = imageLeft + imageRect.width * panel.bounds.xPct / 100;
        const panelTop = imageTop + imageRect.height * panel.bounds.yPct / 100;
        const panelRight = panelLeft + imageRect.width * panel.bounds.widthPct / 100;
        const panelBottom = panelTop + imageRect.height * panel.bounds.heightPct / 100;
        const firstPanelTitleMarginPlacement = panel.panelId === 1 &&
            placement.safeBounds.yPct === 0 &&
            placement.safeBounds.yPct + placement.safeBounds.heightPct <= 7.8125 &&
            placement.safeBounds.xPct >= panel.bounds.xPct &&
            placement.safeBounds.xPct + placement.safeBounds.widthPct <= 13.6719;
        const buttonRight = desiredLeft + buttonWidth;
        const buttonBottom = desiredTop + buttonHeight;
        const bubbleClear = panel.speechUnits.every(unit => {
            const bubbleLeft = imageLeft + imageRect.width * unit.bounds.xPct / 100;
            const bubbleTop = imageTop + imageRect.height * unit.bounds.yPct / 100;
            const bubbleRight = bubbleLeft + imageRect.width * unit.bounds.widthPct / 100;
            const bubbleBottom = bubbleTop + imageRect.height * unit.bounds.heightPct / 100;
            const clearance = 1;
            return buttonRight <= bubbleLeft - clearance || desiredLeft >= bubbleRight + clearance ||
                buttonBottom <= bubbleTop - clearance || desiredTop >= bubbleBottom + clearance;
        });
        if (desiredLeft >= safeLeft && desiredTop >= safeTop &&
            buttonRight <= safeRight && buttonBottom <= safeBottom &&
            desiredLeft >= panelLeft && buttonRight <= panelRight &&
            ((desiredTop >= panelTop && buttonBottom <= panelBottom) ||
                (firstPanelTitleMarginPlacement && desiredTop >= imageTop && buttonBottom <= panelTop)) &&
            bubbleClear) {
            button.style.left = desiredLeft + "px";
            button.style.top = desiredTop + "px";
            button.style.transform = "none";
            button.hidden = false;
            return;
        }
    }
    const viewport = window.visualViewport;
    const viewportLeft = viewport ? viewport.offsetLeft : 0;
    const viewportRight = viewport
        ? viewport.offsetLeft + viewport.width
        : (document.documentElement.clientWidth || window.innerWidth);
    const gap = 4;
    const stackHeight = buttonCount * buttonHeight + Math.max(0, buttonCount - 1) * gap;
    const rightSideFits = imageRect.right + gap + buttonWidth <= viewportRight - 8;
    const leftSideFits = imageRect.left - gap - buttonWidth >= viewportLeft + 8;
    const sideFits = imageRect.height >= stackHeight && (rightSideFits || leftSideFits);

    if (sideFits) {
        wrapper.classList.remove("image-tts-dialogue-speaker-below");
        wrapper.classList.remove("image-tts-dialogue-speaker-below-narrow");
        wrapper.style.paddingBottom = "";
        const sideLeft = rightSideFits
            ? imageLeft + imageRect.width + gap
            : imageLeft - buttonWidth - gap;
        const stackTop = imageTop + Math.max(0, (imageRect.height - stackHeight) / 2);
        button.style.left = sideLeft + "px";
        button.style.top = stackTop + buttonIndex * (buttonHeight + gap) + "px";
    } else {
        const narrowColumn = imageRect.width < buttonWidth * 2 + gap;
        wrapper.classList.toggle("image-tts-dialogue-speaker-below", !narrowColumn);
        wrapper.classList.toggle("image-tts-dialogue-speaker-below-narrow", narrowColumn);
        const row = narrowColumn ? buttonIndex : (panel.panelId <= 2 ? 0 : 1);
        const column = narrowColumn ? 0 : ((panel.panelId === 2 || panel.panelId === 4) ? 1 : 0);
        const rowCount = narrowColumn ? buttonCount : 2;
        const requiredPadding = gap + (rowCount - 1) * (buttonHeight + gap) + buttonHeight;
        wrapper.style.paddingBottom = requiredPadding + "px";
        const desiredLeft = narrowColumn
            ? imageLeft + (imageRect.width - buttonWidth) / 2
            : imageLeft + imageRect.width * (column === 0 ? 0.25 : 0.75) - buttonWidth / 2;
        button.style.left = Math.min(
            Math.max(desiredLeft, imageLeft),
            imageLeft + imageRect.width - buttonWidth
        ) + "px";
        button.style.top = imageTop + imageRect.height + gap + row * (buttonHeight + gap) + "px";
    }
    button.style.transform = "none";
    button.hidden = false;
    if (buttonHeight < 44) {
        button.style.height = "44px";
    }
}

function scheduleEnglishImageTTSLayout() {
    if (englishImageTTSOverlayState.layoutFrame) {
        return;
    }
    const requestFrame = window.requestAnimationFrame || (callback => window.setTimeout(callback, 16));
    englishImageTTSOverlayState.layoutFrame = requestFrame(() => {
        englishImageTTSOverlayState.layoutFrame = 0;
        document.querySelectorAll("#ai-response .image-tts-overlay-wrapper").forEach(layoutEnglishImageTTSPanelSpeakers);
    });
}

function isEnglishImageTTSDrawingMode() {
    return ["pen", "pen-blue", "highlighter", "highlighter-green", "eraser"].includes(drawMode);
}

function syncEnglishImageTTSDrawingMode() {
    const isDrawing = isEnglishImageTTSDrawingMode();
    if (isDrawing) {
        closeEnglishImageTTSMenu();
    }
    document.querySelectorAll("#ai-response .image-tts-panel-speaker").forEach(button => {
        button.disabled = isDrawing;
        button.style.pointerEvents = isDrawing ? "none" : "auto";
        button.setAttribute("aria-disabled", String(isDrawing));
    });
    document.querySelectorAll("#ai-response .image-tts-story-panel-hit-area").forEach(button => {
        button.disabled = isDrawing;
        button.style.pointerEvents = isDrawing ? "none" : "auto";
        button.setAttribute("aria-disabled", String(isDrawing));
    });
    document.querySelectorAll("#ai-response .image-tts-dialogue-panel-hit-area").forEach(button => {
        button.disabled = isDrawing;
        button.style.pointerEvents = isDrawing ? "none" : "auto";
        button.setAttribute("aria-disabled", String(isDrawing));
    });
    document.querySelectorAll("#ai-response .image-tts-business-email-bubble-hit-area").forEach(button => {
        button.disabled = isDrawing;
        button.style.pointerEvents = isDrawing ? "none" : "auto";
        button.setAttribute("aria-disabled", String(isDrawing));
    });
}

function buildEnglishImageTTSPanelText(panel) {
    if (panel && typeof panel.text === "string" && Array.isArray(panel.sentences)) {
        const fullText = getEnglishTTSUnitText(panel.text);
        const sentences = panel.sentences.map(sentence => getEnglishTTSUnitText(sentence));
        if (!fullText || !sentences.length || sentences.some(sentence => !sentence)) {
            return null;
        }
        return { fullText, sentences };
    }

    const parts = [panel.subject, panel.salutation, ...panel.bodySentences];
    if (panel.closing) {
        parts.push(panel.closing);
    }
    const validated = parts.map(part => getEnglishTTSUnitText(part));
    if (validated.some(part => !part)) {
        return null;
    }
    return {
        fullText: validated.join("\n"),
        sentences: panel.bodySentences.map(sentence => getEnglishTTSUnitText(sentence))
    };
}

function createEnglishImageTTSMenuButton(label, ariaLabel, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-label", ariaLabel);
    button.addEventListener("click", event => {
        event.stopPropagation();
        onClick();
    });
    return button;
}

function splitEnglishImageTTSText(text) {
    const safeText = typeof text === "string" ? getEnglishTTSUnitText(text) : null;
    if (!safeText) {
        return [];
    }
    const segmentation = splitEnglishTTSSentences(safeText.replace(/[ \t]*\n[ \t]*/g, " "));
    const sentences = segmentation.reliable
        ? segmentation.sentences.map(sentence => getEnglishTTSUnitText(sentence))
        : [];
    return sentences.length > 1 && sentences.every(Boolean) ? sentences : [safeText];
}

function speakEnglishImageTTSSequence(trigger, sentenceTexts, completionMessage, progressMessage) {
    const units = Array.isArray(sentenceTexts)
        ? sentenceTexts.map(sentence => typeof sentence === "string" ? getEnglishTTSUnitText(sentence) : null)
        : [];
    if (!trigger || !units.length || units.some(unit => !unit) ||
        appState.subjectMode !== "english" || isEnglishImageTTSDrawingMode()) {
        setEnglishTTSStatus("這段圖片英文資料不完整，未開始朗讀。");
        return false;
    }

    cancelEnglishImageTTSDialogueSequence(true);
    cancelEnglishCollocationReplay();
    closeEnglishImageTTSMenu();
    rememberEnglishSpeechTrigger(trigger);
    const generation = englishTTSState.dialogueSequenceGeneration;
    englishTTSState.dialogueSequenceTrigger = trigger;
    let unitIndex = 0;

    const finishSequence = () => {
        if (generation !== englishTTSState.dialogueSequenceGeneration) {
            return;
        }
        cancelEnglishImageTTSDialogueSequence();
        setEnglishTTSStatus(completionMessage);
        updateEnglishTTSControls();
    };
    const playNext = () => {
        if (generation !== englishTTSState.dialogueSequenceGeneration) {
            return false;
        }
        if (appState.subjectMode !== "english" || trigger.isConnected === false) {
            cancelEnglishImageTTSDialogueSequence(true);
            updateEnglishTTSControls();
            return false;
        }
        const started = speakEnglishText(units[unitIndex], () => {
            if (generation !== englishTTSState.dialogueSequenceGeneration) {
                return;
            }
            if (appState.subjectMode !== "english" || trigger.isConnected === false) {
                cancelEnglishImageTTSDialogueSequence(true);
                updateEnglishTTSControls();
                return;
            }
            unitIndex += 1;
            if (unitIndex >= units.length) {
                finishSequence();
                return;
            }
            englishTTSState.dialogueSequenceTimer = window.setTimeout(() => {
                englishTTSState.dialogueSequenceTimer = 0;
                if (generation !== englishTTSState.dialogueSequenceGeneration) {
                    updateEnglishTTSControls();
                    return;
                }
                playNext();
            }, 500);
            setEnglishTTSStatus(progressMessage);
            updateEnglishTTSControls();
        }, false, () => {
            if (generation === englishTTSState.dialogueSequenceGeneration) {
                cancelEnglishImageTTSDialogueSequence();
                updateEnglishTTSControls();
            }
        }, null, null, generation);
        if (!started && generation === englishTTSState.dialogueSequenceGeneration) {
            cancelEnglishImageTTSDialogueSequence();
            updateEnglishTTSControls();
        }
        return started;
    };
    return playNext();
}

function speakEnglishImageTTSFromPanel(trigger, text) {
    const safeText = getEnglishTTSUnitText(text);
    closeEnglishImageTTSMenu(true);
    if (!safeText) {
        setEnglishTTSStatus("這格圖片的英文資料不完整，未開始朗讀。");
        return false;
    }
    const sentences = splitEnglishImageTTSText(safeText);
    if (sentences.length > 1) {
        return speakEnglishImageTTSSequence(
            trigger,
            sentences,
            "圖片段落已朗讀完成。",
            "圖片段落朗讀中，句間停頓 0.5 秒。"
        );
    }
    rememberEnglishSpeechTrigger(trigger);
    return speakEnglishText(safeText);
}

function speakEnglishImageTTSStorySequence(trigger, sentences, fallbackText) {
    const suppliedUnits = Array.isArray(sentences)
        ? sentences.map(sentence => typeof sentence === "string" ? getEnglishTTSUnitText(sentence) : null)
        : [];
    const safeFallbackText = typeof fallbackText === "string" ? getEnglishTTSUnitText(fallbackText) : null;
    const units = suppliedUnits.length && suppliedUnits.every(Boolean)
        ? suppliedUnits.flatMap(sentence => splitEnglishImageTTSText(sentence))
        : [];

    if (!units.length) {
        return safeFallbackText ? speakEnglishImageTTSFromPanel(trigger, safeFallbackText) : false;
    }
    if (units.length === 1) {
        return speakEnglishImageTTSFromPanel(trigger, units[0]);
    }

    cancelEnglishImageTTSStorySequence();
    cancelEnglishCollocationReplay();
    closeEnglishImageTTSMenu(true);
    rememberEnglishSpeechTrigger(trigger);

    const generation = englishTTSState.storySequenceGeneration;
    englishTTSState.storySequenceTrigger = trigger;
    let unitIndex = 0;

    const finishSequence = () => {
        if (generation !== englishTTSState.storySequenceGeneration) {
            return;
        }
        cancelEnglishImageTTSStorySequence();
        setEnglishTTSStatus("故事段落已朗讀完成。");
        updateEnglishTTSControls();
    };

    const playNext = () => {
        if (generation !== englishTTSState.storySequenceGeneration) {
            return false;
        }
        if (appState.subjectMode !== "english" || trigger.isConnected === false) {
            cancelEnglishImageTTSStorySequence();
            updateEnglishTTSControls();
            return false;
        }

        const started = speakEnglishText(units[unitIndex], () => {
            if (generation !== englishTTSState.storySequenceGeneration) {
                return;
            }
            if (appState.subjectMode !== "english" || trigger.isConnected === false) {
                cancelEnglishImageTTSStorySequence();
                updateEnglishTTSControls();
                return;
            }

            unitIndex += 1;
            if (unitIndex >= units.length) {
                finishSequence();
                return;
            }

            englishTTSState.storySequenceTimer = window.setTimeout(() => {
                englishTTSState.storySequenceTimer = 0;
                if (generation !== englishTTSState.storySequenceGeneration) {
                    updateEnglishTTSControls();
                    return;
                }
                if (appState.subjectMode !== "english" || trigger.isConnected === false) {
                    cancelEnglishImageTTSStorySequence();
                    updateEnglishTTSControls();
                    return;
                }
                playNext();
            }, 500);
            setEnglishTTSStatus("故事段落朗讀中，句間停頓 0.5 秒。");
            updateEnglishTTSControls();
        }, true, () => {
            if (generation === englishTTSState.storySequenceGeneration) {
                cancelEnglishImageTTSStorySequence();
                updateEnglishTTSControls();
            }
        }, generation);

        if (!started && generation === englishTTSState.storySequenceGeneration) {
            cancelEnglishImageTTSStorySequence();
            updateEnglishTTSControls();
        }
        return started;
    };

    return playNext();
}

function speakEnglishImageTTSDialogueUnit(trigger, unit) {
    if (!trigger || !unit || appState.subjectMode !== "english" || isEnglishImageTTSDrawingMode()) {
        return false;
    }
    const text = typeof unit.ttsText === "string" ? getEnglishTTSUnitText(unit.ttsText) : null;
    if (!text) {
        setEnglishTTSStatus("這個對話單元的英文資料不完整，未開始朗讀。");
        return false;
    }
    closeEnglishImageTTSMenu();
    const sentences = splitEnglishImageTTSText(text);
    if (sentences.length > 1) {
        return speakEnglishImageTTSSequence(
            trigger,
            sentences,
            "英文對話單元已朗讀完成。",
            "英文對話單元朗讀中，句間停頓 0.5 秒。"
        );
    }
    rememberEnglishSpeechTrigger(trigger);
    return speakEnglishText(text);
}

function speakEnglishImageTTSDialogueSequence(trigger, panel) {
    const sourceUnits = panel && Array.isArray(panel.speechUnits) ? panel.speechUnits : [];
    const unitTexts = sourceUnits.map(unit => unit && typeof unit.ttsText === "string"
        ? getEnglishTTSUnitText(unit.ttsText)
        : null);
    if (!trigger || !unitTexts.length || unitTexts.some(unit => !unit) ||
        appState.subjectMode !== "english" || isEnglishImageTTSDrawingMode()) {
        setEnglishTTSStatus("這格對話圖片的英文資料不完整，未開始朗讀。");
        return false;
    }
    const sentences = unitTexts.flatMap(unit => splitEnglishImageTTSText(unit));
    return speakEnglishImageTTSSequence(
        trigger,
        sentences,
        "英文對話已朗讀完成。",
        "英文對話朗讀中，句間停頓 0.5 秒。"
    );
}

function openEnglishImageTTSMenu(trigger, panel) {
    if (!trigger || !panel || appState.subjectMode !== "english" || isEnglishImageTTSDrawingMode()) {
        return;
    }
    cancelEnglishImageTTSStorySequenceForDifferentTrigger(trigger);
    const dialogueUnits = Array.isArray(panel.speechUnits) ? panel.speechUnits : null;
    const isTapRegionDialogue = Boolean(trigger._englishImageTTSIsTapRegion);
    const dialogueSentences = dialogueUnits
        ? dialogueUnits.map(unit => unit && typeof unit.ttsText === "string"
            ? getEnglishTTSUnitText(unit.ttsText)
            : null)
        : null;
    const content = dialogueUnits
        ? (dialogueSentences.length && dialogueSentences.every(Boolean) &&
            dialogueUnits.every(unit => unit && typeof unit.sourceText === "string" &&
                getEnglishTTSUnitText(unit.sourceText))
            ? { sentences: dialogueSentences }
            : null)
        : buildEnglishImageTTSPanelText(panel);
    if (!content || !content.sentences.length || content.sentences.some(sentence => !sentence)) {
        setEnglishTTSStatus("這格圖片的英文資料不完整，暫時無法朗讀。");
        return;
    }

    closeEnglishImageTTSMenu();
    const menu = englishImageTTSOverlayState.menu;
    if (!menu) {
        return;
    }
    englishImageTTSOverlayState.activeTrigger = trigger;
    menu.classList.toggle("is-tap-regions-dialogue", isTapRegionDialogue);
    trigger.setAttribute("aria-expanded", "true");
    menu.setAttribute("aria-label", dialogueUnits
        ? "第 " + panel.panelId + " 格英文對話朗讀選項"
        : `第 ${panel.panelId} 格英文朗讀選項`);
    while (menu.firstChild) {
        menu.removeChild(menu.firstChild);
    }

    const wholePanelButton = createEnglishImageTTSMenuButton(
        "🔊 朗讀整段",
        dialogueUnits
            ? "依序朗讀第 " + panel.panelId + " 格完整英文對話"
            : `朗讀第 ${panel.panelId} 格完整英文郵件`,
        () => dialogueUnits
            ? speakEnglishImageTTSDialogueSequence(trigger, panel)
            : speakEnglishImageTTSFromPanel(trigger, content.fullText)
    );
    const sentenceToggle = createEnglishImageTTSMenuButton(
        isTapRegionDialogue ? "單位朗讀" : "單句",
        dialogueUnits
            ? (isTapRegionDialogue
                ? "展開第 " + panel.panelId + " 格對話單位朗讀"
                : "展開第 " + panel.panelId + " 格對話單句")
            : `展開第 ${panel.panelId} 格正文單句`,
        () => {
            const sentenceList = menu.querySelector(".english-image-tts-sentences");
            if (!sentenceList) {
                return;
            }
            sentenceList.hidden = !sentenceList.hidden;
            sentenceToggle.setAttribute("aria-expanded", String(!sentenceList.hidden));
            scheduleEnglishImageTTSMenuPosition();
        }
    );
    sentenceToggle.setAttribute("aria-expanded", "false");

    const sentenceList = document.createElement("div");
    sentenceList.className = "english-image-tts-sentences";
    sentenceList.hidden = true;
    content.sentences.forEach((sentence, index) => {
        const unit = dialogueUnits ? dialogueUnits[index] : null;
        sentenceList.appendChild(createEnglishImageTTSMenuButton(
            dialogueUnits ? "🔊 " + unit.sourceText : `🔊 第 ${index + 1} 句`,
            dialogueUnits
                ? (isTapRegionDialogue ? "朗讀單位：" : "朗讀單句：") + unit.sourceText
                : `朗讀第 ${index + 1} 句英文正文`,
            () => dialogueUnits
                ? speakEnglishImageTTSDialogueUnit(trigger, unit)
                : speakEnglishImageTTSFromPanel(trigger, sentence)
        ));
    });

    menu.appendChild(wholePanelButton);
    menu.appendChild(sentenceToggle);
    menu.appendChild(sentenceList);
    menu.hidden = false;
    menu.style.visibility = "hidden";
    positionEnglishImageTTSMenu();
    try {
        wholePanelButton.focus({ preventScroll: true });
    } catch (error) {
        wholePanelButton.focus();
    }
}

function openEnglishImageTTSStoryControls(trigger, panel, controls) {
    if (!trigger || !panel || !controls || appState.subjectMode !== "english" ||
        isEnglishImageTTSDrawingMode()) {
        return;
    }
    cancelEnglishImageTTSStorySequenceForDifferentTrigger(trigger);

        ? panel.sentences.map(sentence => typeof sentence === "string" ? getEnglishTTSUnitText(sentence) : null)
        : [];
    const hasValidPanelSentences = panelSentences.length > 0 && panelSentences.every(Boolean);

    const fullText = content && content.fullText
        ? content.fullText
        : panelText || (hasValidPanelSentences ? getEnglishTTSUnitText(panelSentences.join(" ")) : null);
    const sentences = hasValidPanelSentences ? panelSentences : (fullText ? [fullText] : []);

    closeEnglishImageTTSMenu();

    englishImageTTSOverlayState.activeStoryControls = controls;

    }

    heading.className = "english-image-story-controls-title";

    const actions = document.createElement("div");
    actions.className = "english-image-story-controls-actions";
    actions.appendChild(createEnglishImageTTSMenuButton(

    ));

            }

    );

    actions.appendChild(sentenceToggle);
    actions.appendChild(createEnglishImageTTSMenuButton(
        "關閉",
        `關閉第 ${panel.panelId} 格故事朗讀選單`,
        () => closeEnglishImageTTSMenu(true)
    ));

    const sentenceList = document.createElement("div");
    sentenceList.className = "english-image-story-sentences";
    sentenceList.hidden = true;
    sentences.forEach((sentence, index) => {
        sentenceList.appendChild(createEnglishImageTTSMenuButton(
            `🔊 朗讀第 ${index + 1} 句`,

}

function moveEnglishImageTTSStoryControlsToFloatingLayer(controls) {
    if (!controls || !document.body || controls.parentNode === document.body) {
        return;
    }
    document.body.appendChild(controls);
}

function restoreEnglishImageTTSStoryControls(controls) {
    if (!controls) {
        return;
    }
    const parent = controls._englishImageTTSOriginParent;
    const nextSibling = controls._englishImageTTSOriginNextSibling;
    controls.style.left = "";
    controls.style.top = "";
    controls.style.maxWidth = "";
    controls.style.maxHeight = "";
    controls.style.visibility = "";
    if (parent && parent.isConnected) {
        parent.insertBefore(controls, nextSibling && nextSibling.parentNode === parent ? nextSibling : null);
    } else if (controls.parentNode) {
        controls.parentNode.removeChild(controls);
    }
}

function positionEnglishImageTTSStoryControls(trigger, controls) {
    if (!trigger || !controls || controls.hidden || trigger.isConnected === false) {
        return;
    }
    const triggerRect = trigger.getBoundingClientRect();
    if (!triggerRect.width || !triggerRect.height) {
        return;
    }

    const viewport = window.visualViewport;
    const viewportLeft = viewport ? viewport.offsetLeft : 0;
    const viewportTop = viewport ? viewport.offsetTop : 0;
    const viewportWidth = viewport ? viewport.width : window.innerWidth;
    const viewportHeight = viewport ? viewport.height : window.innerHeight;
    const margin = 10;
    const gap = 8;
    const maxWidth = Math.max(44, viewportWidth - margin * 2);
    const maxHeight = Math.max(44, viewportHeight - margin * 2);
    const triggerLeft = triggerRect.left + viewportLeft;
    const triggerRight = triggerRect.right + viewportLeft;
    const triggerTop = triggerRect.top + viewportTop;
    const triggerBottom = triggerRect.bottom + viewportTop;
    const minTop = viewportTop + margin;
    const maxTop = viewportTop + viewportHeight - margin;
    const roomAbove = Math.max(0, triggerTop - gap - minTop);
    const roomBelow = Math.max(0, maxTop - triggerBottom - gap);

    controls.style.maxWidth = `${Math.min(280, maxWidth)}px`;
    controls.style.maxHeight = `${Math.min(
        maxHeight,
        viewportHeight * 0.55,
        420,
        Math.max(44, roomAbove, roomBelow)
    )}px`;
    controls.style.visibility = "hidden";
    const controlsRect = controls.getBoundingClientRect();
    const width = Math.min(controlsRect.width || 280, maxWidth);
    const height = Math.min(controlsRect.height || 150, maxHeight);
    const minLeft = viewportLeft + margin;
    const maxLeft = viewportLeft + viewportWidth - width - margin;
    const maxMenuTop = maxTop - height;
    const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), Math.max(minimum, maximum));
    const centeredLeft = clamp(triggerLeft + (triggerRect.width - width) / 2, minLeft, maxLeft);
    const candidates = [
        { left: centeredLeft, top: triggerBottom + gap, placement: "below" },
        { left: centeredLeft, top: triggerTop - height - gap, placement: "above" },
        { left: triggerRight + gap, top: clamp(triggerTop, minTop, maxMenuTop), placement: "right" },
        { left: triggerLeft - width - gap, top: clamp(triggerTop, minTop, maxMenuTop), placement: "left" }
    ];
    const fits = candidate => candidate.left >= minLeft && candidate.left <= maxLeft &&
        candidate.top >= minTop && candidate.top <= maxMenuTop;
    let placement = candidates.find(fits);
    if (!placement) {
        placement = candidates[0];
    }
    controls.style.left = `${clamp(placement.left, minLeft, maxLeft)}px`;
    controls.style.top = `${clamp(placement.top, minTop, maxTop)}px`;
    controls.dataset.placement = placement.placement;
    controls.style.visibility = "visible";
}

function positionEnglishImageTTSMenu() {
    const menu = englishImageTTSOverlayState.menu;
    const trigger = englishImageTTSOverlayState.activeTrigger;
    const storyControls = englishImageTTSOverlayState.activeStoryControls;
    if (storyControls && !storyControls.hidden) {
        positionEnglishImageTTSStoryControls(trigger, storyControls);
    }
    if (!menu || menu.hidden || !trigger || trigger.isConnected === false) {
        return;
    }
    const triggerRect = trigger.getBoundingClientRect();
    if (!triggerRect.width || !triggerRect.height) {
        closeEnglishImageTTSMenu();
        return;
    }

    const viewport = window.visualViewport;
    const viewportLeft = viewport ? viewport.offsetLeft : 0;
    const viewportTop = viewport ? viewport.offsetTop : 0;
    const viewportWidth = viewport ? viewport.width : window.innerWidth;
    const viewportHeight = viewport ? viewport.height : window.innerHeight;
    const margin = 10;
    const gap = 8;
    menu.style.visibility = "hidden";
    const menuRect = menu.getBoundingClientRect();
    const width = Math.min(menuRect.width || 260, Math.max(44, viewportWidth - margin * 2));
    const height = Math.min(menuRect.height || 120, Math.max(44, viewportHeight - margin * 2));
    menu.style.maxWidth = `${width}px`;
    const minLeft = viewportLeft + margin;
    const maxLeft = viewportLeft + viewportWidth - width - margin;
    const minTop = viewportTop + margin;
    const maxTop = viewportTop + viewportHeight - height - margin;
    let left;
    let top;
    const menuPointPct = trigger._englishImageTTSMenuPointPct;
    const pointImage = trigger._englishImageTTSMenuImage;
    const pointImageRect = pointImage && pointImage.getBoundingClientRect();
    if (menuPointPct && pointImageRect && pointImageRect.width && pointImageRect.height) {
        const pointX = pointImageRect.left + pointImageRect.width * menuPointPct.xPct / 100 +
            (viewport ? viewport.offsetLeft : 0);
        const pointY = pointImageRect.top + pointImageRect.height * menuPointPct.yPct / 100 +
            (viewport ? viewport.offsetTop : 0);
        left = pointX + gap;
        if (left + width > viewportLeft + viewportWidth - margin) {
            left = pointX - width - gap;
        }
        top = pointY + gap;
        if (top + height > viewportTop + viewportHeight - margin) {
            top = pointY - height - gap;
        }
    } else {
        const triggerLeft = triggerRect.left + (viewport ? viewport.offsetLeft : 0);
        const triggerRight = triggerRect.right + (viewport ? viewport.offsetLeft : 0);
        const triggerTop = triggerRect.top + (viewport ? viewport.offsetTop : 0);
        const triggerBottom = triggerRect.bottom + (viewport ? viewport.offsetTop : 0);
        left = triggerRight - width;
        if (left < minLeft) {
            left = triggerLeft;
        }
        top = triggerBottom + gap;
        if (top + height > viewportTop + viewportHeight - margin) {
            top = triggerTop - height - gap;
        }
    }
    const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), Math.max(minimum, maximum));
    menu.style.left = `${clamp(left, minLeft, maxLeft)}px`;
    menu.style.top = `${clamp(top, minTop, maxTop)}px`;
    menu.style.visibility = "visible";
}

function scheduleEnglishImageTTSMenuPosition() {
    const menuVisible = englishImageTTSOverlayState.menu && !englishImageTTSOverlayState.menu.hidden;
    const storyVisible = englishImageTTSOverlayState.activeStoryControls &&
        !englishImageTTSOverlayState.activeStoryControls.hidden;
    if (englishImageTTSOverlayState.menuPositionFrame || (!menuVisible && !storyVisible)) {
        return;
    }
    const requestFrame = window.requestAnimationFrame || (callback => window.setTimeout(callback, 16));
    englishImageTTSOverlayState.menuPositionFrame = requestFrame(() => {
        englishImageTTSOverlayState.menuPositionFrame = 0;
        positionEnglishImageTTSMenu();
    });
}

function closeEnglishImageTTSMenu(restoreFocus = false) {
    const menu = englishImageTTSOverlayState.menu;
    const trigger = englishImageTTSOverlayState.activeTrigger;
    const storyControls = englishImageTTSOverlayState.activeStoryControls;
    if (trigger && trigger.isConnected !== false) {
        trigger.setAttribute("aria-expanded", "false");
    }
    if (trigger) {
        trigger._englishImageTTSMenuPointPct = null;
        trigger._englishImageTTSMenuImage = null;
    }
    if (menu) {
        menu.classList.remove("is-tap-regions-dialogue");
        menu.hidden = true;
        menu.style.visibility = "";
        while (menu.firstChild) {
            menu.removeChild(menu.firstChild);
        }
    }
    if (storyControls) {
        storyControls.hidden = true;
        while (storyControls.firstChild) {
            storyControls.removeChild(
                storyControls.firstChild
            );
        }
        storyControls.setAttribute("aria-label", "英文故事圖片朗讀選項");
        restoreEnglishImageTTSStoryControls(storyControls);
    }
    englishImageTTSOverlayState.activeStoryControls = null;
    englishImageTTSOverlayState.activeTrigger = null;
    if (restoreFocus && trigger && trigger.isConnected !== false) {
        try {
            trigger.focus({ preventScroll: true });
        } catch (error) {
            if (!storyControls) {
                trigger.focus();
            }
        }
    }
}

function initializeEnglishImageTTSOverlayControls() {
    if (englishImageTTSOverlayState.initialized) {
        return;
    }
    englishImageTTSOverlayState.initialized = true;

    const menu = document.createElement("div");
    menu.id = "english-image-tts-menu";
    menu.className = "english-image-tts-menu";
    menu.hidden = true;
    menu.setAttribute("role", "group");
    menu.setAttribute("aria-label", "圖片英文朗讀選項");
    menu.addEventListener("click", event => event.stopPropagation());
    document.body.appendChild(menu);
    englishImageTTSOverlayState.menu = menu;

    document.addEventListener("click", event => {
        const storyControls = englishImageTTSOverlayState.activeStoryControls;
        if (menu.hidden && (!storyControls || storyControls.hidden)) {
            return;
        }
        const target = event.target;
        if (menu.contains(target) ||
            (storyControls && storyControls.contains(target)) ||
            (englishImageTTSOverlayState.activeTrigger && englishImageTTSOverlayState.activeTrigger.contains(target))) {
            return;
        }
        closeEnglishImageTTSMenu();
    });
    document.addEventListener("keydown", event => {
        const storyControls = englishImageTTSOverlayState.activeStoryControls;
        if (event.key === "Escape" && (!menu.hidden || (storyControls && !storyControls.hidden))) {
            event.preventDefault();
            closeEnglishImageTTSMenu(true);
        }
    });
    window.addEventListener("resize", scheduleEnglishImageTTSLayout);
    window.addEventListener("scroll", scheduleEnglishImageTTSMenuPosition, true);
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", scheduleEnglishImageTTSLayout);
        window.visualViewport.addEventListener("resize", scheduleEnglishImageTTSMenuPosition);
        window.visualViewport.addEventListener("scroll", scheduleEnglishImageTTSMenuPosition);
    }
}

function getSelectionAnswerElement(node) {
    if (!node) {
        return null;
    }
    const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    if (!element) {
        return null;
    }
    const answerElement = element.closest(".ai-answer-text");
    const response = document.getElementById("ai-response");
    return answerElement && response && response.contains(answerElement) ? answerElement : null;
}

function getSelectionAnswerCard(node) {
    if (!node) {
        return null;
    }
    const element = node.nodeType === 1 ? node : node.parentElement;
    return element && typeof element.closest === "function" ? element.closest(".ai-card") : null;
}

function selectionStaysInOneAnswerCard(startNode, endNode) {
    return getSelectionAnswerCard(startNode) === getSelectionAnswerCard(endNode);
}

function captureEnglishAnswerSelection() {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || selection.rangeCount !== 1) {
        return { changed: false, collapsed: Boolean(!selection || selection.isCollapsed) };
    }

    const range = selection.getRangeAt(0);
    const startAnswer = getSelectionAnswerElement(range.startContainer);
    const endAnswer = getSelectionAnswerElement(range.endContainer);
    if (!startAnswer || startAnswer !== endAnswer ||
        !selectionStaysInOneAnswerCard(range.startContainer, range.endContainer) ||
        appState.subjectMode !== "english") {
        if (englishTTSState.answerSequenceType) {
            cancelEnglishAnswerTTSSequence(true);
        }
        clearEnglishTTSSelection("朗讀範圍只限英文模式的 AI 英文回答。");
        return { changed: true, valid: false };
    }

    const result = extractEnglishRangeText(range);
    if (!result.valid) {
        if (englishTTSState.answerSequenceType) {
            cancelEnglishAnswerTTSSequence(true);
        }
        clearEnglishTTSSelection(result.reason);
        return { changed: true, valid: false };
    }

    const previousRange = englishTTSState.lastSelectionRange;
    const selectionChanged = !previousRange || englishTTSState.lastSelectionText !== result.text ||
        previousRange.startContainer !== range.startContainer || previousRange.startOffset !== range.startOffset ||
        previousRange.endContainer !== range.endContainer || previousRange.endOffset !== range.endOffset ||
        (englishTTSState.answerSequenceType === "selection" &&
            englishTTSState.answerSequenceSelectionText !== result.text);
    if (selectionChanged && englishTTSState.answerSequenceType) {
        cancelEnglishAnswerTTSSequence(true);
    }

    if (englishTTSState.collapsedSelectionTimer) {
        window.clearTimeout(englishTTSState.collapsedSelectionTimer);
        englishTTSState.collapsedSelectionTimer = 0;
    }
    englishTTSState.lastSelectionText = result.text;
    englishTTSState.lastSelectionRange = range.cloneRange();
    updateEnglishTTSControls();
    setEnglishTTSStatus(`已保存選取文字（${result.text.length} 個字元）。`);
    scheduleEnglishFloatingButtonPosition();
    return { changed: true, valid: true };
}

function initializeEnglishTTS() {
    if (englishTTSState.initialized) {
        return;
    }
    englishTTSState.initialized = true;

    const panel = document.getElementById("english-tts-panel");
    const voiceSelect = document.getElementById("english-tts-voice");
    const rateSelect = document.getElementById("english-tts-rate");
    const previewButton = document.getElementById("english-tts-preview");
    const speakButton = document.getElementById("english-tts-speak-selection");
    const stopButton = document.getElementById("english-tts-stop");
    const floatingStopButton = document.getElementById("english-tts-floating-stop");
    const response = document.getElementById("ai-response");

    if (panel) {
        panel.hidden = appState.subjectMode !== "english";
    }
    if (floatingStopButton && floatingStopButton.parentNode !== document.body) {
        document.body.appendChild(floatingStopButton);
    }
    if (speakButton && !englishTTSState.buttonHomeParent) {
        englishTTSState.buttonHomeParent = speakButton.parentNode;
        englishTTSState.buttonHomeNextSibling = speakButton.nextSibling;
    }

    const savedRate = readEnglishTTSPreference(ENGLISH_TTS_RATE_KEY);
    englishTTSState.rate = savedRate === "0.8" ? 0.8 : 1;
    if (rateSelect) {
        rateSelect.value = String(englishTTSState.rate);
        rateSelect.addEventListener("change", () => {
            englishTTSState.rate = rateSelect.value === "0.8" ? 0.8 : 1;
            saveEnglishTTSPreference(ENGLISH_TTS_RATE_KEY, String(englishTTSState.rate));
            setEnglishTTSStatus(`語速已設為${englishTTSState.rate === 1 ? "正常" : "慢速"}。`);
        });
    }

    englishTTSState.preferredVoiceKey = readEnglishTTSPreference(ENGLISH_TTS_VOICE_KEY);
    englishTTSState.supported = Boolean(
        window.speechSynthesis && typeof window.SpeechSynthesisUtterance === "function"
    );

    if (!englishTTSState.supported) {
        if (voiceSelect) {
            voiceSelect.disabled = true;
        }
        setEnglishTTSStatus("此瀏覽器沒有可用的 speechSynthesis 英文語音功能。");
    } else {
        englishTTSState.synthesis = window.speechSynthesis;
        if (typeof englishTTSState.synthesis.addEventListener === "function") {
            englishTTSState.synthesis.addEventListener("voiceschanged", refreshLocalEnglishVoices);
        } else {
            englishTTSState.synthesis.onvoiceschanged = refreshLocalEnglishVoices;
        }
        refreshLocalEnglishVoices();
        window.setTimeout(refreshLocalEnglishVoices, 300);
    }

    if (voiceSelect) {
        voiceSelect.addEventListener("change", () => {
            const selected = englishTTSState.voices.find(
                voice => getEnglishTTSVoiceKey(voice) === voiceSelect.value
            );
            if (!selected) {
                return;
            }
            englishTTSState.selectedVoiceKey = getEnglishTTSVoiceKey(selected);
            englishTTSState.preferredVoiceKey = englishTTSState.selectedVoiceKey;
            saveEnglishTTSPreference(ENGLISH_TTS_VOICE_KEY, englishTTSState.preferredVoiceKey);
            updateEnglishTTSControls();
            setEnglishTTSStatus(`已選擇 ${selected.name}（${selected.lang}）。可按「試聽聲線」確認發音。`);
        });
    }

    if (previewButton) {
        previewButton.addEventListener("click", () => {
            rememberEnglishSpeechTrigger(previewButton);
            speakEnglishText(ENGLISH_TTS_SAMPLE);
        });
    }

    if (stopButton) {
        stopButton.addEventListener("click", () => {
            stopEnglishSpeech();
            setEnglishTTSStatus("已停止朗讀。");
        });
    }

    if (floatingStopButton) {
        floatingStopButton.addEventListener("click", () => {
            stopEnglishSpeech();
            setEnglishTTSStatus("已停止朗讀。");
        });
    }

    if (speakButton) {
        speakButton.addEventListener("pointerdown", () => {
            englishTTSState.selectionButtonPointerActive = true;
            if (englishTTSState.collapsedSelectionTimer) {
                window.clearTimeout(englishTTSState.collapsedSelectionTimer);
                englishTTSState.collapsedSelectionTimer = 0;
            }
            if (englishTTSState.selectionButtonPointerTimer) {
                window.clearTimeout(englishTTSState.selectionButtonPointerTimer);
            }
            captureEnglishAnswerSelection();
            englishTTSState.selectionButtonPointerTimer = window.setTimeout(() => {
                englishTTSState.selectionButtonPointerActive = false;
                englishTTSState.selectionButtonPointerTimer = 0;
                const currentSelection = window.getSelection();
                if (!currentSelection || currentSelection.isCollapsed) {
                    clearEnglishTTSSelection("選取已解除，請重新選取英文文字。", true);
                }
            }, 1500);
        });
        speakButton.addEventListener("pointercancel", () => {
            englishTTSState.selectionButtonPointerActive = false;
            if (englishTTSState.selectionButtonPointerTimer) {
                window.clearTimeout(englishTTSState.selectionButtonPointerTimer);
                englishTTSState.selectionButtonPointerTimer = 0;
            }
            const currentSelection = window.getSelection();
            if (!currentSelection || currentSelection.isCollapsed) {
                clearEnglishTTSSelection("選取已解除，請重新選取英文文字。", true);
            }
        });
        speakButton.addEventListener("click", () => {
            if (!englishTTSState.lastSelectionText) {
                captureEnglishAnswerSelection();
            }
            if (englishTTSState.lastSelectionText) {
                // Save the button's visible position before the selection UI can hide or move it.
                rememberEnglishSpeechTrigger(speakButton);
                speakEnglishAnswerSequence(speakButton, englishTTSState.lastSelectionText, "selection");
            } else {
                setEnglishTTSStatus("目前沒有有效的英文選取內容。請在英文回答中重新選取文字。");
            }
            englishTTSState.selectionButtonPointerActive = false;
            if (englishTTSState.selectionButtonPointerTimer) {
                window.clearTimeout(englishTTSState.selectionButtonPointerTimer);
                englishTTSState.selectionButtonPointerTimer = 0;
            }
            const currentSelection = window.getSelection();
            if (!currentSelection || currentSelection.isCollapsed) {
                hideEnglishFloatingButton();
            } else {
                scheduleEnglishFloatingButtonPosition();
            }
        });
    }

    document.addEventListener("selectionchange", () => {
        const selection = window.getSelection();
        if (!selection) {
            clearEnglishTTSSelection("無法取得選取範圍，請重新選取英文文字。");
            return;
        }
        if (selection.isCollapsed) {
            if (!englishTTSState.selectionButtonPointerActive) {
                if (englishTTSState.collapsedSelectionTimer) {
                    window.clearTimeout(englishTTSState.collapsedSelectionTimer);
                }
                englishTTSState.collapsedSelectionTimer = window.setTimeout(() => {
                    englishTTSState.collapsedSelectionTimer = 0;
                    const currentSelection = window.getSelection();
                    if (!englishTTSState.selectionButtonPointerActive &&
                        (!currentSelection || currentSelection.isCollapsed)) {
                        clearEnglishTTSSelection("選取已解除，請重新選取英文文字。", true);
                    }
                }, 250);
            }
            return;
        }
        captureEnglishAnswerSelection();
    });

    window.addEventListener("scroll", scheduleEnglishFloatingButtonPosition, true);
    window.addEventListener("resize", scheduleEnglishFloatingButtonPosition);
    window.addEventListener("scroll", scheduleEnglishTTSFloatingStopPosition, true);
    window.addEventListener("resize", scheduleEnglishTTSFloatingStopPosition);
    if (window.visualViewport) {
        window.visualViewport.addEventListener("scroll", scheduleEnglishFloatingButtonPosition);
        window.visualViewport.addEventListener("resize", scheduleEnglishFloatingButtonPosition);
        window.visualViewport.addEventListener("scroll", scheduleEnglishTTSFloatingStopPosition);
        window.visualViewport.addEventListener("resize", scheduleEnglishTTSFloatingStopPosition);
    }

    if (response && typeof MutationObserver === "function") {
        englishTTSState.observedAnswerRoot = response.querySelector(".ai-answer-text");
        englishTTSState.responseObserver = new MutationObserver(() => {
            const currentAnswerRoot = response.querySelector(".ai-answer-text");
            if (currentAnswerRoot !== englishTTSState.observedAnswerRoot) {
                englishTTSState.observedAnswerRoot = currentAnswerRoot;
                closeEnglishImageTTSMenu();
                stopEnglishSpeech();
            }
            clearEnglishTTSSelection("回答內容已更新，請重新選取英文文字。");
            scheduleEnglishTTSFloatingStopPosition();
        });
        englishTTSState.responseObserver.observe(response, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }

    updateEnglishTTSControls();
}

4. GEPT 常見／考試意思
依 GEPT 程度分級整理目標單字本身真正不同的詞義。這裡的「分級」是單字不同詞義本身的學習難度，不是使用情境、主題、例句、相關知識或搭配詞的難度。只有當目標單字本身在字典中具有可獨立辨識的不同詞義時，才可以分到不同 GEPT 等級。不要把同一詞義換成不同情境來製造新的級別；如果單字只有一個主要詞義，就只列出該詞義所在的適當級別，其餘級別寫「無其他常見獨立詞義」。
- 中高級：只列真正屬於中高級的不同詞義、片語義或固定用法。
- 中級：只列真正屬於中級的不同詞義、片語義或固定用法。
- 初級：只列真正屬於初級的不同詞義、片語義或固定用法。
只有字典中可獨立辨識的不同詞義、片語義或固定用法，才能分到不同 GEPT 等級。注意：如果特殊意思只存在於完整片語、複合詞或固定詞組中，而目標單字本身沒有這個獨立詞義，不得把該片語的特殊意思當成目標單字的新詞義。例如 cat burglar 雖然是固定詞組，但不能因此把 cat 本身列為「偷竊犯」的詞義。寵物貓、野生貓、貓的行為、貓的生活習慣等只是同一詞義的不同情境，也不得當成不同級別。例如 cat 的基本詞義是「貓」，不能把「寵物貓」或「野生貓」當成不同 GEPT 詞義。如果某一級沒有真正不同的常見詞義或用法，請寫「無其他常見獨立詞義」，不要自行創造新的詞義。

  - 中高級：較進階、容易混淆的文法錯誤。

  - 初級：基礎文法與句型常見錯誤。

【翻譯模式】

【比較模式】
比較兩個單字、片語或句型時：

- 提供自然例句與中文意思。
- 指出學生常犯的錯誤。
- 最後提供簡短記憶重點。

say + 說的內容
tell + 人 + 說的內容
並搭配實際例句。

【閱讀模式】
遇到文章或閱讀問題時：
- 說明段落重點。

const ctx = canvas.getContext("2d");


// 🎨 繪圖模式
let drawMode = null;


function setDrawMode(mode){

    drawMode = mode;

    syncEnglishImageTTSDrawingMode();

    console.log("🎨目前模式:", drawMode);


    if(drawMode === "pen" || drawMode === "pen-blue" || drawMode === "highlighter" || drawMode === "highlighter-green" || drawMode === "eraser"){

        canvas.style.pointerEvents = "auto";
        canvas.style.touchAction = "none";

    }


    if(drawMode === "select"){

        canvas.style.pointerEvents = "none";
        canvas.style.touchAction = "auto";

    }

}

// 🎨 預設畫筆設定

let drawing = false;

ctx.strokeStyle = "red";
ctx.lineWidth = 5;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.globalAlpha = 1;


// 預設為選取模式
canvas.style.pointerEvents = "none";
canvas.style.touchAction = "auto";

function resizeAnnotationCanvas(){

    const width = responseBox.scrollWidth;
    const height = responseBox.scrollHeight;


    canvas.width = width;
    canvas.height = height;


    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    canvas.style.top = responseBox.offsetTop + "px";


    // 🎨 保持畫筆設定

    ctx.strokeStyle = "red";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";


    console.log(
        "🎨 Canvas同步尺寸:",
        width,
        height
    );

}

// ============================
// 清除標註
// ============================

function clearAnnotation(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawing = false;

    console.log("🧹 已清除標註");

}


canvas.addEventListener("pointerdown", function(e){

    canvas.setPointerCapture(e.pointerId);

    console.log("🎨 開始畫線", e.clientX, e.clientY);

    drawing = true;

    // 🎨 根據模式設定畫筆

    if(drawMode === "pen"){

        ctx.strokeStyle = "red";
        ctx.lineWidth = 5;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "pen-blue"){

        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 5;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "highlighter"){

        ctx.strokeStyle = "#ffff66";
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.25;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "highlighter-green"){

        ctx.strokeStyle = "#86efac";
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.25;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "eraser"){

        ctx.lineWidth = 25;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "destination-out";

    }



    const rect = canvas.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;


if(drawMode === "pen" || drawMode === "pen-blue" || drawMode === "eraser"){

    ctx.beginPath();
    ctx.moveTo(x,y);

}


if(drawMode === "highlighter" || drawMode === "highlighter-green"){

    ctx.beginPath();

}

});


canvas.addEventListener("pointermove", function(e){

    console.log("🖐 pointermove 進入");

    if (!drawing) return;


    const rect = canvas.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;


    console.log("✏️ 移動", x, y);

    // 🎨 保持目前工具效果

    if(drawMode === "pen"){

        ctx.strokeStyle = "red";
        ctx.lineWidth = 5;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

    }


    if(drawMode === "highlighter"){

        ctx.strokeStyle = "#ffff66";
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.25;
        ctx.globalCompositeOperation = "source-over";

    }


if(drawMode === "highlighter" || drawMode === "highlighter-green"){

    ctx.save();

    if(drawMode === "highlighter"){

        ctx.strokeStyle = "rgba(255,255,0,0.07)";

    }

    if(drawMode === "highlighter-green"){

        ctx.strokeStyle = "rgba(134,239,172,0.07)";

    }
    ctx.lineWidth = 12;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.restore();

}
else{

    ctx.lineTo(x, y);
    ctx.stroke();

}

});


canvas.addEventListener("pointerup", function(e){

    canvas.releasePointerCapture(e.pointerId);

});
