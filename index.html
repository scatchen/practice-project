<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="國中數學教學助手 - 國中數學公式資料庫與課堂大字投影板。">
    <title>國中數學教學助手 - 數學公式資料庫</title>

    <!-- 引入高品質字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800;900&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- KaTeX 數學公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>

    <style>
        :root {
            /* 白板高對比模式 */
            --bg-color: #e8edf3;
            --container-bg: #f8fafc;
            --card-bg: #f8fafc;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --primary-color: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.12);
            --accent-green: #059669;
            --accent-orange: #d97706;
            --accent-purple: #7c3aed;
            --button-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.08);
            --font-scale: 1.0;
            --canvas-bg: #ffffff;
            --canvas-stroke: #2563eb;
        }

        /* 深色黑板投影模式 */
        [data-theme="chalkboard"] {
            --bg-color: #0b1614;
            --container-bg: #10201c;
            --card-bg: #152b25;
            --border-color: #204037;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --primary-color: #2dd4bf;
            --primary-glow: rgba(45, 212, 191, 0.18);
            --accent-green: #34d399;
            --accent-orange: #fb923c;
            --accent-purple: #c084fc;
            --button-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
            --canvas-bg: #19302a;
            --canvas-stroke: #fdba74;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;

            padding: 100px 1rem 1rem 1rem;

            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1366px;
            font-size: calc(1.05rem * var(--font-scale));
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 頂部主控面板 */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 0.6rem 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 9999;
        }

        .title-area h1 {
            font-size: calc(1.5rem * var(--font-scale));
            font-weight: 900;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* iPad 教學模式隱藏系統標題 */


        .title-area p {
            font-size: calc(0.85rem * var(--font-scale));
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }

        .action-group {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            min-width: 0;
        }

        .btn-ctrl {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1rem;
            font-size: calc(0.9rem * var(--font-scale));
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: var(--button-shadow);
            user-select: none;
        }

        .btn-ctrl:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-1px);
        }

        .btn-ctrl:active {
            transform: scale(0.97);
        }

        .btn-fullscreen {
            background: var(--primary-color);
            color: #ffffff;
            border-color: transparent;
        }

        .btn-fullscreen:hover {
            opacity: 0.9;
            color: #ffffff;
        }

        /* 側邊導覽 + 主顯示區雙欄佈局 */
        .layout-grid {
            display: grid;
            grid-template-columns:1fr;
            gap: 1.2rem;
            align-items: start;
        }

        /* 側邊導覽 + 主顯示區雙欄佈局 */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 1rem;
            box-shadow: var(--button-shadow);
        }

        /* 教學模式隱藏側邊公式導覽 */
        .sidebar-nav{
            display:none;
        }

        .nav-item {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 1rem 0.8rem;
            font-size: calc(1.1rem * var(--font-scale));
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: var(--button-shadow);
            width: 100%;
            text-align: left;
            user-select: none;
            transition: all 0.2s ease;
        }

        .nav-item .icon {
            font-size: 1.4rem;
        }

        .nav-item:hover {
            transform: translateX(4px);
            border-color: var(--primary-color);
        }

        .nav-item.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .main-content {
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 28px;
            padding: 2rem;
            min-height: 600px;
            box-shadow: var(--button-shadow);
            position: relative;
        }

        .module-section {
            display: none;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .module-section.active-section {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= 儀表板 ================= */
        .welcome-card {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-purple) 100%);
            color: white;
            border-radius: 20px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--button-shadow);
        }
        .ai-card {
border-radius: 16px;
padding: 16px;
margin: 12px 0;
line-height: 1.8;
}

.ai-card h3 {
margin-top: 0;
margin-bottom: 10px;
font-size: 1.2em;
}

.ai-card p {
margin: 0;
white-space: pre-line;
}

.ai-understand {
background: #dbeafe;
border-left: 6px solid #2563eb;
color: #111827;
}

.ai-example {
background: #dcfce7;
border-left: 6px solid #16a34a;
color: #111827;
}

.ai-remember {
background: #fed7aa;
border-left: 6px solid #ea580c;
color: #111827;
}

        .welcome-card h2 {
            font-size: calc(1.6rem * var(--font-scale));
            font-weight: 800;
            margin-bottom: 0.4rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .dashboard-panel {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--button-shadow);
        }

        .dashboard-panel h3 {
            font-size: calc(1.2rem * var(--font-scale));
            margin-bottom: 1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .timer-display {
            font-family: 'Fira Code', monospace;
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--text-primary);
            text-align: center;
            margin: 0.8rem 0;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            border: 2px solid var(--border-color);
        }

        [data-theme="chalkboard"] .timer-display {
            background: rgba(255, 255, 255, 0.04);
        }

        .timer-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .btn-preset {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }

        .student-num-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-orange);
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            border: 2px dashed var(--border-color);
            margin-bottom: 1rem;
        }

        [data-theme="chalkboard"] .student-num-display {
            background: rgba(255, 255, 255, 0.04);
        }

        .student-config {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .student-config input {
            width: 70px;
            padding: 0.4rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            text-align: center;
            background: var(--container-bg);
            color: var(--text-primary);
        }

        /* ================= 可展開收合單元卡片 (Accordion) ================= */
        .unit-accordion {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            margin-bottom: 1.2rem;
            overflow: hidden;
            box-shadow: var(--button-shadow);
        }

        .unit-header {
            width: 100%;
            background: var(--card-bg);
            border: none;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            text-align: left;
        }

        .unit-title-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .unit-icon {
            font-size: 1.8rem;
        }

        .unit-title {
            font-size: calc(1.3rem * var(--font-scale));
            font-weight: 800;
            color: var(--text-primary);
        }

        .unit-badge {
            background: var(--primary-glow);
            color: var(--primary-color);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
        }

        .unit-arrow {
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .unit-accordion.active .unit-arrow {
            transform: rotate(180deg);
        }

        .unit-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--container-bg);
            border-top: 1px solid transparent;
        }

        .unit-accordion.active .unit-content {
            max-height: 6000px;
            /* 大容量容許展開所有公式 */
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
        }

        /* ================= 公式詳細展示卡片 ================= */
        .formula-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--button-shadow);
        }

        .formula-box:last-child {
            margin-bottom: 0;
        }

        .formula-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--primary-color);
            padding-left: 0.8rem;
            margin-bottom: 1rem;
        }

        .formula-box-title {
            font-size: calc(1.2rem * var(--font-scale));
            font-weight: 700;
            color: var(--primary-color);
        }

        .math-blackboard {
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            margin: 1rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }

        [data-theme="chalkboard"] .math-blackboard {
            background: rgba(0, 0, 0, 0.3);
        }

        .math-display {
            font-size: calc(1.7rem * var(--font-scale));
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.2rem;
            font-size: 0.95em;
        }

        .info-block {
            background: rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
        }

        [data-theme="chalkboard"] .info-block {
            background: rgba(255, 255, 255, 0.01);
        }

        .info-block-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.4rem;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        /* 典型例題板塊 */
        .example-block {
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .example-header {
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-action-large {
            width: 100%;
            background: var(--primary-color);
            color: white !important;
            border: none;
            padding: 0.9rem;
            font-size: calc(1rem * var(--font-scale));
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--button-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            user-select: none;
            margin-top: 0.8rem;
        }

        .btn-action-large:active {
            transform: scale(0.99);
        }

        /* 答案解析 */
        .solution-detail {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 12px;
        }

        [data-theme="chalkboard"] .solution-detail {
            background: rgba(255, 255, 255, 0.02);
        }

        .solution-detail.show {
            max-height: 1000px;
            opacity: 1;
            margin-top: 1rem;
            padding: 1.2rem;
            border: 2px solid var(--border-color);
        }

        /* 塗鴉板 */
        .scribble-box {
            margin-top: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: var(--canvas-bg);
        }

        .scribble-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 0.5rem 0.8rem;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85em;
        }

        .brush-colors {
            display: flex;
            gap: 0.4rem;
        }

        .brush-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .brush-dot.selected {
            border-color: var(--text-primary);
            transform: scale(1.15);
        }

        .scribble-canvas {
            display: block;
            width: 100%;
            height: 200px;
            cursor: crosshair;
            touch-action: none;
        }

        .ai-answer-text {
            font-size: 1.5em;
        } 

        .english-keyword {
            color: #facc15;
            font-weight: 700;
        }

        .english-tts-auto-controls {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            margin: 3px 6px;
            vertical-align: middle;
            user-select: none;
            -webkit-user-select: none;
        }

        .english-tts-auto-control {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 9px;
            background: #1d4ed8;
            color: #ffffff;
            font: inherit;
            font-size: 0.72em;
            font-weight: 700;
            line-height: 1.2;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .english-tts-auto-control:focus-visible {
            outline: 3px solid #facc15;
            outline-offset: 2px;
        }

        .english-tts-auto-sentences {
            display: inline-flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }

        .english-tts-auto-sentences[hidden] {
            display: none;
        }

        .image-tts-overlay-wrapper {
            position: relative;
            display: block;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto 20px;
        }

        .image-tts-overlay-wrapper > img {
            display: block;
            width: 100%;
            max-width: 1200px;
            height: auto;
            margin: 0 auto;
        }

        .image-tts-panel-speaker {
            position: absolute;
            z-index: 11;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            background: #1d4ed8;
            color: #ffffff;
            font: inherit;
            font-size: 22px;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .image-tts-panel-speaker:focus-visible,
        .english-image-tts-menu button:focus-visible {
            outline: 3px solid #facc15;
            outline-offset: 2px;
        }

        .image-tts-panel-speaker:disabled {
            cursor: default;
            opacity: 0.72;
        }

        .image-tts-story-panel-hit-area {
            position: absolute;
            z-index: 9;
            display: block;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .image-tts-story-panel-hit-area:focus-visible {
            outline: 3px solid #facc15;
            outline-offset: -3px;
        }

        .image-tts-story-panel-hit-area:disabled {
            cursor: default;
        }

        .image-tts-dialogue-panel-hit-area {
            position: absolute;
            z-index: 9;
            display: block;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 4px;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            color: transparent;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .image-tts-dialogue-panel-hit-area[hidden] {
            display: none;
        }

        .image-tts-dialogue-panel-hit-area:focus-visible {
            outline: 3px solid #facc15;
            outline-offset: -3px;
        }

        .image-tts-dialogue-panel-hit-area:disabled {
            cursor: default;
        }

        .image-tts-business-email-bubble-hit-area {
            position: absolute;
            z-index: 10;
            display: block;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 6px;
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            color: transparent;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .image-tts-business-email-bubble-hit-area[hidden] {
            display: none;
        }

        .image-tts-business-email-bubble-hit-area:focus-visible {
            outline: 3px solid #facc15;
            outline-offset: -3px;
        }

        .image-tts-business-email-bubble-hit-area:disabled {
            cursor: default;
        }

        .image-tts-dialogue-speaker-below {
            box-sizing: border-box;
        }

        .image-tts-dialogue-speaker-below-narrow {
            box-sizing: border-box;
        }

        .english-image-story-controls {
            box-sizing: border-box;
            position: fixed;
            z-index: 12100;
            width: min(280px, calc(100vw - 20px));
            max-height: min(55vh, 420px);
            overflow: auto;
            margin: 0;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 10px;

        }

        .mode-group {

        }

        .btn-mode:hover:not(.active) {
            background: var(--container-bg);
            color: var(--text-primary);
        }

        /* mode 顯示控制 */
        .formula-mode-only {
            display: block;
        }

        .concept-mode-only {
            display: none;
        }

        .solution-mode-only {
            display: none;
        }

        body[data-mode="concept"] .formula-mode-only {
            display: none;
        }

        body[data-mode="concept"] .concept-mode-only {
            display: block;
        }

        body[data-mode="concept"] .solution-mode-only {
            display: none;

        body[data-mode="solution"] .formula-mode-only {

        }

        body[data-mode="solution"] .concept-mode-only {
            display: none;
        }

        body[data-mode="solution"] .solution-mode-only {
            display: block;
        }

        body:not([data-mode]) .extra-section,

        }

        body[data-mode="concept"] .extra-section {

        }

        body[data-mode="solution"] .extra-section {
            display: block;
        }

        function setupCanvas(canvas) {
            if (!canvas) return;
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();

            // iPad 高清晰度配置
            canvas.width = rect.width - 4;
            canvas.height = 200;

            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;

            const strokeColor = appState.theme === 'whiteboard' ? '#2563eb' : '#fdba74';
            ctx.strokeStyle = strokeColor;

            // 綁定觸控事件
            let drawing = false;

            function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - r.left,
                    y: clientY - r.top
                };
            }

            function start(e) {
                e.preventDefault();
                drawing = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function draw(e) {
                if (!drawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                drawing = false;
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseleave', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const gain = ctx.createGain();

                osc1.type = 'triangle';
                osc2.type = 'sine';

                osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc1.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);
                osc2.frequency.setValueAtTime(659.25, ctx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.2);

                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.2);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(ctx.destination);

                osc1.start();
                osc2.start();
                osc1.stop(ctx.currentTime + 1.2);
                osc2.stop(ctx.currentTime + 1.2);
            } catch (e) {
                console.warn("聲音初始化失敗。");

        }

        function drawWheel() {

            const ctx = canvas.getContext('2d');
            const half = canvas.width / 2;

            const list = [];
            appState.database.forEach(group => {
                group.formulas.forEach(form => {
                    list.push(form.name);
                });
            });

            const len = list.length;
            if (len === 0) return;

            const arcAngle = (2 * Math.PI) / len;
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4', '#ef4444', '#14b8a6'];

            for (let i = 0; i < len; i++) {
                const angle = appState.wheelStartAngle + i * arcAngle;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.moveTo(half, half);
                ctx.arc(half, half, half - 10, angle, angle + arcAngle);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = appState.theme === 'whiteboard' ? '#ffffff' : '#10201c';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 畫文字
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.translate(half, half);
                ctx.rotate(angle + arcAngle / 2);
                ctx.textAlign = "right";
                ctx.font = "bold 12px Noto Sans TC";

                // 截斷過長字元
                const name = list[i].length > 10 ? list[i].substring(0, 9) + '..' : list[i];
                ctx.fillText(name, half - 25, 4);
                ctx.restore();
            }

            // 外圈橙色裝飾線
            ctx.strokeStyle = '#ea580c';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(half, half, half - 10, 0, 2 * Math.PI);
            ctx.stroke();
        }

function getEnglishTargetWord(question) {
    const text = question.trim();

    const patterns = [
        /what\s+is\s+(?:a|an|the)\s+["']?([a-z][a-z'-]*)["']?/i,
        /what\s+is\s+["']?([a-z][a-z'-]*)["']?/i,
        /what\s+does\s+["']?([a-z][a-z'-]*)["']?\s+mean/i,
        /meaning\s+of\s+(?:a|an|the)\s+["']?([a-z][a-z'-]*)["']?/i,
        /meaning\s+of\s+["']?([a-z][a-z'-]*)["']?/i,
        /define\s+(?:a|an|the)\s+["']?([a-z][a-z'-]*)["']?/i,
        /define\s+["']?([a-z][a-z'-]*)["']?/i
    ];

    for (const pattern of patterns) {
        const match = text.match(pattern);
        if (match) {
            return match[1].toLowerCase();
        }
    }

    return "";
}

function replaceEnglishCollocations(answer, word) {
    const collocations = getEnglishCollocations(word);

    if (collocations.length === 0) {
        return answer;
    }

    const lines = collocations.map((item, index) => {
        const number = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"][index];
        return `${number} ${item.phrase} — ${item.meaning}`;
    });

    const replacement = "Common Collocations\n" + lines.join("\n\n");

    return answer.replace(
        /Common Collocations[\s\S]*?(?=\n\s*(?:Example Sentences|3\.|GEPT Common|4\.))/i,
        replacement + "\n\n"
    );
}

function formatEnglishAnswer(answer) {

    answer = answer.replace(/\*\*/g, "");
    answer = answer.replace(/\*/g, "");

    answer = answer.replace(
        /1\./g,
        "\n\n\n①"
    );

    answer = answer.replace(
        /2\./g,
        "\n②"
    );

    answer = answer.replace(
        /3\./g,
        "\n\n③"
    );

    answer = answer.replace(
        /4\./g,
        "\n\n④"
    );

    answer = answer.replace(
        /5\./g,
        "\n\n⑤"
    );

    answer = answer.replace(
        /6\./g,
        "\n\n⑥"
    );

    answer = answer.replace(
        /7\./g,
        "\n\n⑦"
    );

    answer = answer.replace(
        /8\./g,
        "\n\n⑧"
    );

    answer = answer.replace(
        /9\./g,
        "\n\n⑨"
    );

    answer = answer.replace(
        /10\./g,
        "\n\n⑩"
    );

    return answer;
}

function hideEnglishFloatingButton() {
    if (englishTTSState.positionTimer) {
        window.clearTimeout(englishTTSState.positionTimer);
        englishTTSState.positionTimer = 0;
    }
    if (englishTTSState.positionFrame) {
        window.cancelAnimationFrame(englishTTSState.positionFrame);
        englishTTSState.positionFrame = 0;
    }
    const button = document.getElementById("english-tts-speak-selection");
    if (button) {
        button.classList.remove("is-floating");
        button.style.visibility = "";
        button.style.left = "";
        button.style.top = "";
        button.setAttribute("aria-hidden", "true");
        if (englishTTSState.buttonHomeParent && button.parentNode !== englishTTSState.buttonHomeParent) {
            const nextSibling = englishTTSState.buttonHomeNextSibling;
            const insertBefore = nextSibling && nextSibling.parentNode === englishTTSState.buttonHomeParent
                ? nextSibling
                : null;
            englishTTSState.buttonHomeParent.insertBefore(button, insertBefore);
        }
    }
    positionEnglishTTSFloatingStopButton();
}

function scheduleEnglishFloatingButtonPosition() {
    if (!englishTTSState.lastSelectionText || englishTTSState.selectionButtonPointerActive) {
        return;
    }
    const button = document.getElementById("english-tts-speak-selection");
    if (button && button.classList.contains("is-floating")) {
        // Keep the control away from Safari's selection handles while the user adjusts the range.
        button.style.visibility = "hidden";
    }
    if (englishTTSState.positionTimer) {
        window.clearTimeout(englishTTSState.positionTimer);
    }
    englishTTSState.positionTimer = window.setTimeout(() => {
        englishTTSState.positionTimer = 0;
        if (englishTTSState.positionFrame) {
            window.cancelAnimationFrame(englishTTSState.positionFrame);
        }
        englishTTSState.positionFrame = window.requestAnimationFrame(() => {
            englishTTSState.positionFrame = 0;
            positionEnglishFloatingButton();
        });
    }, 160);
}

function positionEnglishFloatingButton() {
    const button = document.getElementById("english-tts-speak-selection");
    if (!button || appState.subjectMode !== "english" || !englishTTSState.lastSelectionText) {
        hideEnglishFloatingButton();
        return;
    }

    if (button.parentNode !== document.body) {
        document.body.appendChild(button);
    }
    button.classList.add("is-floating");
    button.style.visibility = "hidden";
    button.setAttribute("aria-hidden", "false");

    const buttonRect = button.getBoundingClientRect();
    const visualViewport = window.visualViewport;
    const viewportLeft = visualViewport ? visualViewport.offsetLeft : 0;
    const viewportTop = visualViewport ? visualViewport.offsetTop : 0;
    const viewportWidth = visualViewport ? visualViewport.width : window.innerWidth;
    const viewportHeight = visualViewport ? visualViewport.height : window.innerHeight;
    const viewportRight = viewportLeft + viewportWidth;
    const viewportBottom = viewportTop + viewportHeight;
    const margin = 12;
    const gap = 12;
    const width = buttonRect.width || 112;
    const height = buttonRect.height || 48;
    const minLeft = viewportLeft + margin;
    const minTop = viewportTop + margin;
    const maxLeft = Math.max(minLeft, viewportRight - width - margin);
    const maxTop = Math.max(minTop, viewportBottom - height - margin);
    let selectedBounds = null;
    let selectionLineRects = [];
    let anchorRect = null;

    try {
        if (englishTTSState.lastSelectionRange) {
            const rangeRect = englishTTSState.lastSelectionRange.getBoundingClientRect();
            const coordinateOffsetLeft = visualViewport ? visualViewport.offsetLeft : 0;
            const coordinateOffsetTop = visualViewport ? visualViewport.offsetTop : 0;
            selectedBounds = {
                left: rangeRect.left + coordinateOffsetLeft,
                right: rangeRect.right + coordinateOffsetLeft,
                top: rangeRect.top + coordinateOffsetTop,
                bottom: rangeRect.bottom + coordinateOffsetTop,
                width: rangeRect.width,
                height: rangeRect.height
            };
            const rangeClientRects = typeof englishTTSState.lastSelectionRange.getClientRects === "function"
                ? englishTTSState.lastSelectionRange.getClientRects()
                : [];
            const clientRects = Array.from(rangeClientRects)
                .filter(rect => rect.width > 0 && rect.height > 0)
                .map(rect => ({
                    left: rect.left + coordinateOffsetLeft,
                    right: rect.right + coordinateOffsetLeft,
                    top: rect.top + coordinateOffsetTop,
                    bottom: rect.bottom + coordinateOffsetTop,
                    width: rect.width,
                    height: rect.height
                }));
            if (clientRects.length) {
                selectionLineRects = clientRects;
                anchorRect = clientRects[clientRects.length - 1];
            } else {
                anchorRect = selectedBounds;
                selectionLineRects = selectedBounds ? [selectedBounds] : [];
            }
        }
    } catch (error) {
        selectedBounds = null;
        selectionLineRects = [];
        anchorRect = null;
    }

    const selectedBoundsAreUsable = selectedBounds &&
        Number.isFinite(selectedBounds.left) &&
        Number.isFinite(selectedBounds.top) &&
        selectedBounds.width > 0 &&
        selectedBounds.height > 0 &&
        selectedBounds.width <= viewportWidth * 0.95 &&
        selectedBounds.height <= viewportHeight * 0.8;

    let left;
    let top;

    if (selectedBoundsAreUsable && anchorRect) {
        const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), maximum);
        const candidates = [
            { left: clamp(anchorRect.right - width, minLeft, maxLeft), top: anchorRect.bottom + gap },
            { left: anchorRect.right + gap, top: clamp(anchorRect.top + (anchorRect.height - height) / 2, minTop, maxTop) },
            { left: anchorRect.left - width - gap, top: clamp(anchorRect.top + (anchorRect.height - height) / 2, minTop, maxTop) },
            { left: clamp(anchorRect.right - width, minLeft, maxLeft), top: anchorRect.top - height - gap }
        ];
        const fitsAndAvoidsSelection = candidate =>
            candidate.left >= minLeft &&
            candidate.left + width <= viewportRight - margin &&
            candidate.top >= minTop &&
            candidate.top + height <= viewportBottom - margin &&
            selectionLineRects.every(rect =>
                candidate.left + width <= rect.left ||
                candidate.left >= rect.right ||
                candidate.top + height <= rect.top ||
                candidate.top >= rect.bottom
            );
        const nearbyPosition = candidates.find(fitsAndAvoidsSelection);

        if (nearbyPosition) {
            left = nearbyPosition.left;
            top = nearbyPosition.top;
        }
    }

    if (!Number.isFinite(left) || !Number.isFinite(top)) {
        // Large or unavailable ranges use a viewport corner opposite the selection.
        const centerX = selectedBoundsAreUsable
            ? selectedBounds.left + selectedBounds.width / 2
            : viewportLeft + viewportWidth / 2;
        const centerY = selectedBoundsAreUsable
            ? selectedBounds.top + selectedBounds.height / 2
            : viewportTop + viewportHeight / 2;
        left = centerX < viewportLeft + viewportWidth / 2 ? maxLeft : minLeft;
        top = centerY < viewportTop + viewportHeight / 2 ? maxTop : minTop;
        left = Math.min(Math.max(left, minLeft), maxLeft);
        top = Math.min(Math.max(top, minTop), maxTop);
    }

    button.style.left = `${left}px`;
    button.style.top = `${top}px`;
    button.style.visibility = "visible";
    positionEnglishTTSFloatingStopButton();
}

function rememberEnglishSpeechTrigger(trigger) {
    englishTTSState.activeSpeechTrigger = trigger && typeof trigger.getBoundingClientRect === "function"
        ? trigger
        : null;
    englishTTSState.activeSpeechTriggerRect = null;
    englishTTSState.activeImageTTSWrapper = englishTTSState.activeSpeechTrigger &&
        typeof englishTTSState.activeSpeechTrigger.closest === "function"
        ? englishTTSState.activeSpeechTrigger.closest(".image-tts-overlay-wrapper")
        : null;
    englishTTSState.activeSpeechIsImageTTS = Boolean(englishTTSState.activeImageTTSWrapper);
    const dialoguePanel = englishTTSState.activeSpeechTrigger &&
        englishTTSState.activeSpeechTrigger._englishImageTTSDialoguePanel;
    const dialoguePanelId = englishTTSState.activeSpeechTrigger &&
        englishTTSState.activeSpeechTrigger.getAttribute("data-image-tts-panel-id");
    const hasDialogueTriggerClass = englishTTSState.activeSpeechTrigger &&
        englishTTSState.activeSpeechTrigger.classList &&
        (englishTTSState.activeSpeechTrigger.classList.contains("image-tts-dialogue-speaker") ||
            englishTTSState.activeSpeechTrigger.classList.contains("image-tts-dialogue-panel-hit-area"));
    const hasValidPercentBounds = bounds => bounds &&
        [bounds.xPct, bounds.yPct, bounds.widthPct, bounds.heightPct].every(value =>
            Number.isFinite(value) && value >= 0 && value <= 100) &&
        bounds.xPct + bounds.widthPct <= 100.01 && bounds.yPct + bounds.heightPct <= 100.01;
    const hasValidDialogueUnits = dialoguePanel && Array.isArray(dialoguePanel.speechUnits) &&
        dialoguePanel.speechUnits.length > 0 &&
        dialoguePanel.speechUnits.every(unit => unit && hasValidPercentBounds(unit.bounds));
    englishTTSState.activeImageTTSDialoguePanel = englishTTSState.activeImageTTSWrapper &&
        hasDialogueTriggerClass && dialoguePanel &&
        String(dialoguePanel.panelId) === dialoguePanelId &&
        hasValidPercentBounds(dialoguePanel.bounds) && hasValidDialogueUnits
        ? dialoguePanel
        : null;
    const storyPanel = englishTTSState.activeSpeechTrigger &&
        englishTTSState.activeSpeechTrigger._englishImageTTSPanel;
    const hasStoryTriggerClass = englishTTSState.activeSpeechTrigger &&
        englishTTSState.activeSpeechTrigger.classList &&
        englishTTSState.activeSpeechTrigger.classList.contains("image-tts-story-panel-hit-area");
    const storyPanelId = englishTTSState.activeSpeechTrigger &&
        englishTTSState.activeSpeechTrigger.getAttribute("data-image-tts-panel-id");
    englishTTSState.activeImageTTSStoryPanel = englishTTSState.activeImageTTSWrapper &&
        hasStoryTriggerClass && storyPanel &&
        String(storyPanel.panelId) === storyPanelId &&
        (!englishTTSState.activeImageTTSWrapper.contains ||
            englishTTSState.activeImageTTSWrapper.contains(englishTTSState.activeSpeechTrigger))
        ? storyPanel
        : null;

    if (!englishTTSState.activeSpeechTrigger) {
        return;
    }

    try {
        const rect = englishTTSState.activeSpeechTrigger.getBoundingClientRect();
        if (!rect || !rect.width || !rect.height) {
            return;
        }
        const viewport = window.visualViewport;
        englishTTSState.activeSpeechTriggerRect = {
            left: rect.left + (viewport ? viewport.offsetLeft : 0),
            right: rect.right + (viewport ? viewport.offsetLeft : 0),
            top: rect.top + (viewport ? viewport.offsetTop : 0),
            bottom: rect.bottom + (viewport ? viewport.offsetTop : 0),
            width: rect.width,
            height: rect.height,
            visualOffsetLeft: viewport ? viewport.offsetLeft : 0,
            visualOffsetTop: viewport ? viewport.offsetTop : 0
        };
    } catch (error) {
        englishTTSState.activeSpeechTriggerRect = null;
    }
}
