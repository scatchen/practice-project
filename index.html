<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="國中數學教學助手 - 國中數學公式資料庫與課堂大字投影板。">
    <title>國中數學教學助手 - 數學公式資料庫</title>

    <!-- 引入高品質字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800;900&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- KaTeX 數學公式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        crossorigin="anonymous"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>

    <style>
        :root {
            /* 白板高對比模式 */
            --bg-color: #e8edf3;
            --container-bg: #f8fafc;
            --card-bg: #f8fafc;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --primary-color: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.12);
            --accent-green: #059669;
            --accent-orange: #d97706;
            --accent-purple: #7c3aed;
            --button-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.08);
            --font-scale: 1.0;
            --canvas-bg: #ffffff;
            --canvas-stroke: #2563eb;
        }

        /* 深色黑板投影模式 */
        [data-theme="chalkboard"] {
            --bg-color: #0b1614;
            --container-bg: #10201c;
            --card-bg: #152b25;
            --border-color: #204037;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --primary-color: #2dd4bf;
            --primary-glow: rgba(45, 212, 191, 0.18);
            --accent-green: #34d399;
            --accent-orange: #fb923c;
            --accent-purple: #c084fc;
            --button-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
            --canvas-bg: #19302a;
            --canvas-stroke: #fdba74;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;

            padding: 100px 1rem 1rem 1rem;

            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1366px;
            font-size: calc(1.05rem * var(--font-scale));
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 頂部主控面板 */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 0.6rem 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 9999;
        }

        .title-area h1 {
            font-size: calc(1.5rem * var(--font-scale));
            font-weight: 900;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* iPad 教學模式隱藏系統標題 */


        .title-area p {
            font-size: calc(0.85rem * var(--font-scale));
            color: var(--text-secondary);
            margin-top: 0.1rem;
        }

        .action-group {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            min-width: 0;
        }

        .btn-ctrl {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1rem;
            font-size: calc(0.9rem * var(--font-scale));
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: var(--button-shadow);
            user-select: none;
        }

        .btn-ctrl:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-1px);
        }

        .btn-ctrl:active {
            transform: scale(0.97);
        }

        .btn-fullscreen {
            background: var(--primary-color);
            color: #ffffff;
            border-color: transparent;
        }

        .btn-fullscreen:hover {
            opacity: 0.9;
            color: #ffffff;
        }

        /* 側邊導覽 + 主顯示區雙欄佈局 */
        .layout-grid {
            display: grid;
            grid-template-columns:1fr;
            gap: 1.2rem;
            align-items: start;
        }

        /* 側邊導覽 + 主顯示區雙欄佈局 */
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 1rem;
            box-shadow: var(--button-shadow);
        }

        /* 教學模式隱藏側邊公式導覽 */
        .sidebar-nav{
            display:none;
        }

        .nav-item {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 1rem 0.8rem;
            font-size: calc(1.1rem * var(--font-scale));
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: var(--button-shadow);
            width: 100%;
            text-align: left;
            user-select: none;
            transition: all 0.2s ease;
        }

        .nav-item .icon {
            font-size: 1.4rem;
        }

        .nav-item:hover {
            transform: translateX(4px);
            border-color: var(--primary-color);
        }

        .nav-item.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .main-content {
            background: var(--container-bg);
            border: 2px solid var(--border-color);
            border-radius: 28px;
            padding: 2rem;
            min-height: 600px;
            box-shadow: var(--button-shadow);
            position: relative;
        }

        .module-section {
            display: none;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .module-section.active-section {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================= 儀表板 ================= */
        .welcome-card {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-purple) 100%);
            color: white;
            border-radius: 20px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--button-shadow);
        }
        .ai-card {
border-radius: 16px;
padding: 16px;
margin: 12px 0;
line-height: 1.8;
}

.ai-card h3 {
margin-top: 0;
margin-bottom: 10px;
font-size: 1.2em;
}

.ai-card p {
margin: 0;
white-space: pre-line;
}

.ai-understand {
background: #dbeafe;
border-left: 6px solid #2563eb;
color: #111827;
}

.ai-example {
background: #dcfce7;
border-left: 6px solid #16a34a;
color: #111827;
}

.ai-remember {
background: #fed7aa;
border-left: 6px solid #ea580c;
color: #111827;
}

        .welcome-card h2 {
            font-size: calc(1.6rem * var(--font-scale));
            font-weight: 800;
            margin-bottom: 0.4rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .dashboard-panel {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--button-shadow);
        }

        .dashboard-panel h3 {
            font-size: calc(1.2rem * var(--font-scale));
            margin-bottom: 1rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .timer-display {
            font-family: 'Fira Code', monospace;
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--text-primary);
            text-align: center;
            margin: 0.8rem 0;
            padding: 0.8rem;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            border: 2px solid var(--border-color);
        }

        [data-theme="chalkboard"] .timer-display {
            background: rgba(255, 255, 255, 0.04);
        }

        .timer-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .btn-preset {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.4rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }

        .student-num-display {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--accent-orange);
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            border: 2px dashed var(--border-color);
            margin-bottom: 1rem;
        }

        [data-theme="chalkboard"] .student-num-display {
            background: rgba(255, 255, 255, 0.04);
        }

        .student-config {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .student-config input {
            width: 70px;
            padding: 0.4rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            text-align: center;
            background: var(--container-bg);
            color: var(--text-primary);
        }

        /* ================= 可展開收合單元卡片 (Accordion) ================= */
        .unit-accordion {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            margin-bottom: 1.2rem;
            overflow: hidden;
            box-shadow: var(--button-shadow);
        }

        .unit-header {
            width: 100%;
            background: var(--card-bg);
            border: none;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            text-align: left;
        }

        .unit-title-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .unit-icon {
            font-size: 1.8rem;
        }

        .unit-title {
            font-size: calc(1.3rem * var(--font-scale));
            font-weight: 800;
            color: var(--text-primary);
        }

        .unit-badge {
            background: var(--primary-glow);
            color: var(--primary-color);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.2rem 0.6rem;
            border-radius: 8px;
        }

        .unit-arrow {
            font-size: 1.2rem;
            color: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .unit-accordion.active .unit-arrow {
            transform: rotate(180deg);
        }

        .unit-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            background: var(--container-bg);
            border-top: 1px solid transparent;
        }

        .unit-accordion.active .unit-content {
            max-height: 6000px;
            /* 大容量容許展開所有公式 */
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
        }

        /* ================= 公式詳細展示卡片 ================= */
        .formula-box {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--button-shadow);
        }

        .formula-box:last-child {
            margin-bottom: 0;
        }

        .formula-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--primary-color);
            padding-left: 0.8rem;
            margin-bottom: 1rem;
        }

        .formula-box-title {
            font-size: calc(1.2rem * var(--font-scale));
            font-weight: 700;
            color: var(--primary-color);
        }

        .math-blackboard {
            background: rgba(0, 0, 0, 0.03);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            margin: 1rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto;
        }

        [data-theme="chalkboard"] .math-blackboard {
            background: rgba(0, 0, 0, 0.3);
        }

        .math-display {
            font-size: calc(1.7rem * var(--font-scale));
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.2rem;
            font-size: 0.95em;
        }

        .info-block {
            background: rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
        }

        [data-theme="chalkboard"] .info-block {
            background: rgba(255, 255, 255, 0.01);
        }

        .info-block-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.4rem;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        /* 典型例題板塊 */
        .example-block {
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .example-header {
            font-weight: bold;
            color: var(--accent-orange);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-action-large {
            width: 100%;
            background: var(--primary-color);
            color: white !important;
            border: none;
            padding: 0.9rem;
            font-size: calc(1rem * var(--font-scale));
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--button-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            user-select: none;
            margin-top: 0.8rem;
        }

        .btn-action-large:active {
            transform: scale(0.99);
        }

        /* 答案解析 */
        .solution-detail {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 12px;
        }

        [data-theme="chalkboard"] .solution-detail {
            background: rgba(255, 255, 255, 0.02);
        }

        .solution-detail.show {
            max-height: 1000px;
            opacity: 1;
            margin-top: 1rem;
            padding: 1.2rem;
            border: 2px solid var(--border-color);
        }

        /* 塗鴉板 */
        .scribble-box {
            margin-top: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: var(--canvas-bg);
        }

        .scribble-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 0.5rem 0.8rem;
            border-bottom: 2px solid var(--border-color);
            font-size: 0.85em;
        }

        .brush-colors {
            display: flex;
            gap: 0.4rem;
        }

        .brush-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .brush-dot.selected {
            border-color: var(--text-primary);
            transform: scale(1.15);
        }

        .scribble-canvas {
            display: block;
            width: 100%;
            height: 200px;
            cursor: crosshair;
            touch-action: none;
        }

        .ai-answer-text {
            font-size: 1.5em;
        } 

        .english-keyword {
            color: #facc15;
            font-weight: 700;
        }

        /* ================= 課堂大輪盤 ================= */
        .wheel-container {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
            align-items: center;
            padding: 1rem 0;
        }

        .wheel-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .wheel-svg-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid var(--accent-orange);
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            transform: rotate(0deg);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
        }

        .btn-spin-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid var(--accent-orange);
            color: var(--accent-orange);
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 5;
            user-select: none;
        }

        .btn-spin-center:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .wheel-right {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--button-shadow);
        }

        .wheel-result-panel {
            background: var(--container-bg);
            border: 2px dashed var(--accent-orange);
            border-radius: 15px;
            padding: 1.2rem;
            font-size: calc(1.05rem * var(--font-scale));
            color: var(--text-primary);
            min-height: 120px;
            margin-bottom: 1rem;
        }

        /* 響應式佈局 */
        @media (max-width: 1300px) {
            .control-bar {
                padding: 0.6rem 1rem;
                border-radius: 16px;
                overflow-x: auto;
            }

            .title-area h1 {
                font-size: 1.1rem;
            }

            .title-area p {
                display: none;
            }

            .btn-ctrl {
                padding: 0.5rem 0.7rem;
                border-radius: 10px;
                white-space: nowrap;
            }

            .layout-grid {
                grid-template-columns: 1fr;
            }

            .sidebar-nav {
                flex-direction: row;
                overflow-x: auto;
                padding: 0.6rem;
                white-space: nowrap;
            }

            .nav-item {
                width: auto;
                padding: 0.8rem 1.2rem;
                font-size: 1.05rem;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .wheel-container {
                grid-template-columns: 1fr;
            }
        }

        /* iPad 橫向教學模式隱藏標題 */
        @media (max-width:1200px) and (orientation:landscape){

            .title-area{
                display:none;
            }

        }

        /* ================= Teacher Mode 切換按鈕 ================= */
        .mode-group {
            display: flex;
            gap: 0.3rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 0.3rem;
        }

        .btn-mode {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.45rem 0.85rem;
            font-size: calc(0.85rem * var(--font-scale));
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .btn-mode.active {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 2px 6px var(--primary-glow);
        }

        .btn-mode:hover:not(.active) {
            background: var(--container-bg);
            color: var(--text-primary);
        }

        /* mode 顯示控制 */
        .formula-mode-only {
            display: block;
        }

        .concept-mode-only {
            display: none;
        }

        .solution-mode-only {
            display: none;
        }

        body[data-mode="concept"] .formula-mode-only {
            display: none;
        }

        body[data-mode="concept"] .concept-mode-only {
            display: block;
        }

        body[data-mode="concept"] .solution-mode-only {
            display: none;
        }

        body[data-mode="solution"] .formula-mode-only {
            display: none;
        }

        body[data-mode="solution"] .concept-mode-only {
            display: none;
        }

        body[data-mode="solution"] .solution-mode-only {
            display: block;
        }

        function setupCanvas(canvas) {
            if (!canvas) return;
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();

            // iPad 高清晰度配置
            canvas.width = rect.width - 4;
            canvas.height = 200;

            const ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;

            const strokeColor = appState.theme === 'whiteboard' ? '#2563eb' : '#fdba74';
            ctx.strokeStyle = strokeColor;

            // 綁定觸控事件
            let drawing = false;

            function getPos(e) {
                const r = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - r.left,
                    y: clientY - r.top
                };
            }

            function start(e) {
                e.preventDefault();
                drawing = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function draw(e) {
                if (!drawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                drawing = false;
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseleave', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

            if (canvas) {
                canvas.getContext('2d').strokeStyle = color;

        }

                ctx.beginPath();
                ctx.moveTo(half, half);

                ctx.closePath();

                // 畫文字

function getEnglishTargetWord(question) {
    const text = question.trim();

    const patterns = [
        /what\s+is\s+(?:a|an|the)\s+["']?([a-z][a-z'-]*)["']?/i,
        /what\s+is\s+["']?([a-z][a-z'-]*)["']?/i,
        /what\s+does\s+["']?([a-z][a-z'-]*)["']?\s+mean/i,
        /meaning\s+of\s+(?:a|an|the)\s+["']?([a-z][a-z'-]*)["']?/i,
        /meaning\s+of\s+["']?([a-z][a-z'-]*)["']?/i,
        /define\s+(?:a|an|the)\s+["']?([a-z][a-z'-]*)["']?/i,
        /define\s+["']?([a-z][a-z'-]*)["']?/i
    ];

    for (const pattern of patterns) {
        const match = text.match(pattern);
        if (match) {
            return match[1].toLowerCase();

}

function getEnglishCollocations(word) {

}

function replaceEnglishCollocations(answer, word) {
    const collocations = getEnglishCollocations(word);

    if (collocations.length === 0) {
        return answer;
    }

    const lines = collocations.map((item, index) => {
        const number = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"][index];
        return `${number} ${item.phrase} — ${item.meaning}`;
    });

    const replacement = "Common Collocations\n" + lines.join("\n\n");

    return answer.replace(
        /Common Collocations[\s\S]*?(?=\n\s*(?:Example Sentences|3\.|GEPT Common|4\.))/i,
        replacement + "\n\n"
    );
}

const canvas = document.getElementById("annotation-canvas");
const responseBox = document.getElementById("ai-response");

canvas.style.background = "transparent";

const rect = responseBox.getBoundingClientRect();

canvas.width = rect.width;
canvas.height = rect.height;

canvas.style.width = rect.width + "px";
canvas.style.height = rect.height + "px";

console.log("🎨 Canvas 尺寸：", canvas.width, canvas.height);

// ============================
// Annotation Tool - Step 1-12
// ============================

const ctx = canvas.getContext("2d");


// 🎨 繪圖模式
let drawMode = null;


function setDrawMode(mode){

    drawMode = mode;

    console.log("🎨目前模式:", drawMode);


    if(drawMode === "pen" || drawMode === "pen-blue" || drawMode === "highlighter" || drawMode === "highlighter-green" || drawMode === "eraser"){

        canvas.style.pointerEvents = "auto";
        canvas.style.touchAction = "none";

    }


    if(drawMode === "select"){

        canvas.style.pointerEvents = "none";
        canvas.style.touchAction = "auto";

    }

}

// 🎨 預設畫筆設定

let drawing = false;

ctx.strokeStyle = "red";
ctx.lineWidth = 5;
ctx.lineCap = "round";
ctx.lineJoin = "round";
ctx.globalAlpha = 1;


// 預設為選取模式
canvas.style.pointerEvents = "none";
canvas.style.touchAction = "auto";

function resizeAnnotationCanvas(){

    const width = responseBox.scrollWidth;
    const height = responseBox.scrollHeight;


    canvas.width = width;
    canvas.height = height;


    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    canvas.style.top = responseBox.offsetTop + "px";


    // 🎨 保持畫筆設定

    ctx.strokeStyle = "red";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";


    console.log(
        "🎨 Canvas同步尺寸:",
        width,
        height
    );

}

// ============================
// 清除標註
// ============================

function clearAnnotation(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawing = false;

    console.log("🧹 已清除標註");

}


canvas.addEventListener("pointerdown", function(e){

    canvas.setPointerCapture(e.pointerId);

    console.log("🎨 開始畫線", e.clientX, e.clientY);

    drawing = true;

    // 🎨 根據模式設定畫筆

    if(drawMode === "pen"){

        ctx.strokeStyle = "red";
        ctx.lineWidth = 5;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "pen-blue"){

        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 5;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "highlighter"){

        ctx.strokeStyle = "#ffff66";
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.25;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "highlighter-green"){

        ctx.strokeStyle = "#86efac";
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.25;
        ctx.globalCompositeOperation = "source-over";

    }

    if(drawMode === "eraser"){

        ctx.lineWidth = 25;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "destination-out";

    }



    const rect = canvas.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;


if(drawMode === "pen" || drawMode === "pen-blue" || drawMode === "eraser"){

    ctx.beginPath();
    ctx.moveTo(x,y);

}


if(drawMode === "highlighter" || drawMode === "highlighter-green"){

    ctx.beginPath();

}

});


canvas.addEventListener("pointermove", function(e){

    console.log("🖐 pointermove 進入");

    if (!drawing) return;


    const rect = canvas.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;


    console.log("✏️ 移動", x, y);

    // 🎨 保持目前工具效果

    if(drawMode === "pen"){

        ctx.strokeStyle = "red";
        ctx.lineWidth = 5;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";

    }


    if(drawMode === "highlighter"){

        ctx.strokeStyle = "#ffff66";
        ctx.lineWidth = 12;
        ctx.globalAlpha = 0.25;
        ctx.globalCompositeOperation = "source-over";

    }


if(drawMode === "highlighter" || drawMode === "highlighter-green"){

    ctx.save();

    if(drawMode === "highlighter"){

        ctx.strokeStyle = "rgba(255,255,0,0.07)";

    }

    if(drawMode === "highlighter-green"){

        ctx.strokeStyle = "rgba(134,239,172,0.07)";

    }
    ctx.lineWidth = 12;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.lineTo(x, y);
    ctx.stroke();

    ctx.restore();

}
else{

    ctx.lineTo(x, y);
    ctx.stroke();

}

});


canvas.addEventListener("pointerup", function(e){

    drawing = false;

    canvas.releasePointerCapture(e.pointerId);

});


canvas.addEventListener("pointerup", function() {

    drawing = false;

});


canvas.addEventListener("pointerleave", function() {

    drawing = false;

});

</script>
