function calculateEnglishImageTTSStoryStopPlacement({
    viewport,
    safeInsets,
    buttonSize,
    panelRect,
    obstacles,
    margin = 8
}) {
    const isFiniteRect = rect => rect &&
        [rect.left, rect.top, rect.right, rect.bottom].every(Number.isFinite);
    if (!viewport || !Number.isFinite(viewport.left) || !Number.isFinite(viewport.top) ||
        !Number.isFinite(viewport.width) || !Number.isFinite(viewport.height) ||
        viewport.width <= 0 || viewport.height <= 0) {
        return null;
    }

    const viewportRight = viewport.left + viewport.width;
    const viewportBottom = viewport.top + viewport.height;
    let safeLeft = viewport.left + Math.max(0, safeInsets.left || 0) + margin;
    let safeRight = viewportRight - Math.max(0, safeInsets.right || 0) - margin;
    let safeTop = viewport.top + Math.max(0, safeInsets.top || 0) + margin;
    let safeBottom = viewportBottom - Math.max(0, safeInsets.bottom || 0) - margin;
    if (safeRight < safeLeft) {
        safeLeft = safeRight = viewport.left + viewport.width / 2;
    }
    if (safeBottom < safeTop) {
        safeTop = safeBottom = viewport.top + viewport.height / 2;
    }

    const availableWidth = Math.max(1, safeRight - safeLeft);
    const availableHeight = Math.max(1, safeBottom - safeTop);
    const width = Math.min(Math.max(1, buttonSize.width || 144), availableWidth);
    const height = Math.min(Math.max(1, buttonSize.height || 52), availableHeight);
    const maxLeft = Math.max(safeLeft, safeRight - width);
    const maxTop = Math.max(safeTop, safeBottom - height);
    const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), maximum);
    const intersects = (first, second) => isFiniteRect(first) && isFiniteRect(second) &&
        first.left < second.right && first.right > second.left &&
        first.top < second.bottom && first.bottom > second.top;
    const targetIsVisible = isFiniteRect(panelRect) &&
        panelRect.right > safeLeft && panelRect.left < safeRight &&
        panelRect.bottom > safeTop && panelRect.top < safeBottom;
    const nearbyCandidates = [];

    if (targetIsVisible) {
        const centerLeft = panelRect.left + (panelRect.right - panelRect.left - width) / 2;
        const centerTop = panelRect.top + (panelRect.bottom - panelRect.top - height) / 2;
        const gap = 8;
        nearbyCandidates.push(
            { left: centerLeft, top: panelRect.top - height - gap },
            { left: centerLeft, top: panelRect.bottom + gap },
            { left: panelRect.left - width - gap, top: centerTop },
            { left: panelRect.right + gap, top: centerTop },
            { left: panelRect.left - width - gap, top: panelRect.top - height - gap },
            { left: panelRect.right + gap, top: panelRect.top - height - gap },
            { left: panelRect.left - width - gap, top: panelRect.bottom + gap },
            { left: panelRect.right + gap, top: panelRect.bottom + gap }
        );
    }

    const dockCandidates = [
        { left: safeLeft, top: safeTop },
        { left: maxLeft, top: safeTop },
        { left: safeLeft, top: maxTop },
        { left: maxLeft, top: maxTop },
        { left: safeLeft, top: (safeTop + maxTop) / 2 },
        { left: maxLeft, top: (safeTop + maxTop) / 2 },
        { left: (safeLeft + maxLeft) / 2, top: safeTop },
        { left: (safeLeft + maxLeft) / 2, top: maxTop }
    ];
    const candidates = [];
    const seen = new Set();
    [...nearbyCandidates, ...dockCandidates].forEach(candidate => {
        const placement = {
            left: clamp(candidate.left, safeLeft, maxLeft),
            top: clamp(candidate.top, safeTop, maxTop)
        };
        const key = String(Math.round(placement.left * 10)) + ":" +
            String(Math.round(placement.top * 10));
        if (!seen.has(key)) {
            seen.add(key);
            candidates.push(placement);
        }
    });

    const allObstacles = [
        ...(targetIsVisible ? [{ ...panelRect, kind: "panel" }] : []),
        ...(Array.isArray(obstacles) ? obstacles.filter(isFiniteRect) : [])
    ];
    const hasCollision = (candidate, blockedBy) => {
        const buttonRect = {
            left: candidate.left,
            top: candidate.top,
            right: candidate.left + width,
            bottom: candidate.top + height
        };
        return blockedBy.some(obstacle => intersects(buttonRect, obstacle));
    };
    const preferred = candidates.find(candidate => !hasCollision(candidate, allObstacles));
    if (preferred) {
        return { ...preferred, width, height, mode: targetIsVisible && nearbyCandidates.length ? "near-panel" : "docked" };
    }

    // Keep the control clear of the fixed header and drawing tools before relaxing panel avoidance.
    const controls = (Array.isArray(obstacles) ? obstacles : [])
        .filter(obstacle => obstacle && obstacle.kind === "controls");
    const safeDock = dockCandidates.map(candidate => ({
        left: clamp(candidate.left, safeLeft, maxLeft),
        top: clamp(candidate.top, safeTop, maxTop)
    }));
    const clearOfControls = safeDock.find(candidate => !hasCollision(candidate, controls));
    if (clearOfControls) {
        return { ...clearOfControls, width, height, mode: "safe-dock" };
    }

    // A final in-viewport position keeps Stop reachable even when every preferred area is occupied.
    return { ...safeDock[0], width, height, mode: "visible-fallback" };
}

function placeEnglishImageTTSStoryStopButton(button, wrapper, panel) {
    if (!button) {
        return false;
    }

    clearEnglishTTSImageStopRow(button);
    if (button.parentNode !== document.body) {
        document.body.appendChild(button);
    }
    button.classList.add("is-image-tts-story-stop-control");
    button.hidden = false;
    button.style.position = "fixed";
    button.style.zIndex = "12200";
    button.style.inset = "auto";
    button.style.right = "auto";
    button.style.bottom = "auto";
    button.style.transform = "none";

    const visualViewport = window.visualViewport;
    const viewportLeft = visualViewport && Number.isFinite(visualViewport.offsetLeft)
        ? visualViewport.offsetLeft
        : 0;
    const viewportTop = visualViewport && Number.isFinite(visualViewport.offsetTop)
        ? visualViewport.offsetTop
        : 0;
    const viewportWidth = visualViewport && Number.isFinite(visualViewport.width) && visualViewport.width > 0
        ? visualViewport.width
        : window.innerWidth;
    const viewportHeight = visualViewport && Number.isFinite(visualViewport.height) && visualViewport.height > 0
        ? visualViewport.height
        : window.innerHeight;
    const readSafeInset = name => {
        try {
            const value = parseFloat(window.getComputedStyle(button).getPropertyValue(name));
            return Number.isFinite(value) && value > 0 ? value : 0;
        } catch (error) {
            return 0;
        }
    };
    const safeInsets = {
        top: readSafeInset("--english-tts-safe-top"),
        right: readSafeInset("--english-tts-safe-right"),
        bottom: readSafeInset("--english-tts-safe-bottom"),
        left: readSafeInset("--english-tts-safe-left")
    };
    const margin = 8;
    const safeWidth = Math.max(1, viewportWidth - safeInsets.left - safeInsets.right - margin * 2);
    const safeHeight = Math.max(1, viewportHeight - safeInsets.top - safeInsets.bottom - margin * 2);
    button.style.minWidth = "0";
    button.style.maxWidth = String(safeWidth) + "px";
    button.style.minHeight = String(Math.min(52, safeHeight)) + "px";
    button.style.maxHeight = String(safeHeight) + "px";
    button.style.visibility = "hidden";

    const measured = button.getBoundingClientRect();
    const buttonSize = {
        width: Math.min(measured.width || 144, safeWidth),
        height: Math.min(measured.height || 52, safeHeight)
    };
    let panelRect = null;
    const bounds = panel && panel.bounds;
    const hasUsableBounds = bounds &&
        [bounds.xPct, bounds.yPct, bounds.widthPct, bounds.heightPct].every(value =>
            Number.isFinite(value) && value >= 0 && value <= 100) &&
        bounds.widthPct > 0 && bounds.heightPct > 0 &&
        bounds.xPct + bounds.widthPct <= 100.01 &&
        bounds.yPct + bounds.heightPct <= 100.01;
    if (wrapper && wrapper.isConnected !== false && hasUsableBounds) {
        try {
            const image = wrapper.querySelector("img");
            const imageRect = image && image.getBoundingClientRect();
            if (imageRect && imageRect.width > 0 && imageRect.height > 0 &&
                [imageRect.left, imageRect.top, imageRect.width, imageRect.height].every(Number.isFinite)) {
                const imageLeft = imageRect.left + viewportLeft;
                const imageTop = imageRect.top + viewportTop;
                panelRect = {
                    left: imageLeft + imageRect.width * bounds.xPct / 100,
                    top: imageTop + imageRect.height * bounds.yPct / 100,
                    right: imageLeft + imageRect.width * (bounds.xPct + bounds.widthPct) / 100,
                    bottom: imageTop + imageRect.height * (bounds.yPct + bounds.heightPct) / 100
                };
            }
        } catch (error) {
            panelRect = null;
        }
    }

    const obstacles = [];
    const obstacleSelectors = [
        { selector: ".control-bar", kind: "controls" },
        { selector: ".brush-colors", kind: "controls" },
        { selector: ".scribble-box", kind: "controls" },
        { selector: ".english-image-story-controls:not([hidden])", kind: "panel" },
        { selector: ".english-image-tts-menu:not([hidden])", kind: "panel" },
        { selector: "#english-tts-panel:not([hidden])", kind: "panel" }
    ];
    obstacleSelectors.forEach(({ selector, kind }) => {
        document.querySelectorAll(selector).forEach(element => {
            if (!element || element === button || element.hidden) {
                return;
            }
            try {
                const style = window.getComputedStyle(element);
                if (style.display === "none" || style.visibility === "hidden") {
                    return;
                }
                const rect = element.getBoundingClientRect();
                if (!rect || rect.width <= 0 || rect.height <= 0 ||
                    ![rect.left, rect.top, rect.right, rect.bottom].every(Number.isFinite)) {
                    return;
                }
                obstacles.push({
                    left: rect.left + viewportLeft,
                    top: rect.top + viewportTop,
                    right: rect.right + viewportLeft,
                    bottom: rect.bottom + viewportTop,
                    kind
                });
            } catch (error) {
                // An unreadable obstruction must not prevent Stop from being placed.
            }
        });
    });

    const placement = calculateEnglishImageTTSStoryStopPlacement({
        viewport: {
            left: viewportLeft,
            top: viewportTop,
            width: Number.isFinite(viewportWidth) && viewportWidth > 0 ? viewportWidth : 320,
            height: Number.isFinite(viewportHeight) && viewportHeight > 0 ? viewportHeight : 480
        },
        safeInsets,
        buttonSize,
        panelRect,
        obstacles,
        margin
    });
    const fallbackViewportWidth = Number.isFinite(viewportWidth) && viewportWidth > 0 ? viewportWidth : 320;
    const fallbackViewportHeight = Number.isFinite(viewportHeight) && viewportHeight > 0 ? viewportHeight : 480;
    const fallbackWidth = Math.min(buttonSize.width, fallbackViewportWidth);
    const fallbackHeight = Math.min(buttonSize.height, fallbackViewportHeight);
    const left = placement
        ? placement.left
        : viewportLeft + Math.max(0, (fallbackViewportWidth - fallbackWidth) / 2);
    const top = placement
        ? placement.top
        : viewportTop + Math.max(0, (fallbackViewportHeight - fallbackHeight) * 0.65);
    button.style.left = String(left) + "px";
    button.style.top = String(top) + "px";
    button.style.visibility = "visible";
    button.hidden = false;
    return true;
}

function placeEnglishImageTTSStopButton(button, wrapper) {
    englishTTSState.imageTTSStopButton = button;
    if (!wrapper || wrapper.isConnected === false || !wrapper.parentNode) {
        button.hidden = true;
        clearEnglishTTSImageStopRow(button);
        return false;
    }

    let row = englishTTSState.imageTTSStopRow;
    if (!row || !row.classList.contains("english-tts-image-stop-row")) {
        row = document.createElement("div");
        row.className = "english-tts-image-stop-row";
        englishTTSState.imageTTSStopRow = row;
    }
    if (row.parentNode !== wrapper.parentNode || row.previousSibling !== wrapper) {
        wrapper.parentNode.insertBefore(row, wrapper.nextSibling);
    }
    if (button.parentNode !== row) {
        row.appendChild(button);
    }

    resetEnglishTTSFloatingStopButtonStyles(button);
    button.classList.add("is-image-tts-stop-control");
    button.hidden = false;

    if (!englishTTSState.imageTTSStopObserver && typeof MutationObserver === "function" && document.body) {
        englishTTSState.imageTTSStopObserver = new MutationObserver(() => {
            const currentWrapper = englishTTSState.activeImageTTSWrapper;
            const currentRow = englishTTSState.imageTTSStopRow;
            if (!currentWrapper || currentWrapper.isConnected === false || !currentRow ||
                currentRow.isConnected === false || currentRow.parentNode !== currentWrapper.parentNode ||
                currentRow.previousSibling !== currentWrapper) {
                scheduleEnglishTTSFloatingStopPosition();
            }
        });
        englishTTSState.imageTTSStopObserver.observe(document.body, { childList: true, subtree: true });
    }
    return true;
}

function placeEnglishImageTTSDialogueStopButton(button, wrapper, panel) {
    if (!wrapper || wrapper.isConnected === false || !panel || !panel.bounds ||
        !Array.isArray(panel.speechUnits)) {
        return false;
    }

    clearEnglishTTSImageStopRow(button);
    if (button.parentNode !== document.body) {
        document.body.appendChild(button);
    }
    button.classList.add("is-image-tts-dialogue-stop-control");
    button.hidden = false;
    button.style.position = "fixed";
    button.style.zIndex = "11900";
    button.style.inset = "auto";
    button.style.right = "auto";
    button.style.bottom = "auto";

    const viewport = window.visualViewport;
    const viewportLeft = viewport ? viewport.offsetLeft : 0;
    const viewportTop = viewport ? viewport.offsetTop : 0;
    const viewportWidth = viewport ? (viewport.width || window.innerWidth) : window.innerWidth;
    const viewportHeight = viewport ? (viewport.height || window.innerHeight) : window.innerHeight;
    const readSafeInset = name => {
        try {
            return parseFloat(window.getComputedStyle(button).getPropertyValue(name)) || 0;
        } catch (error) {
            return 0;
        }
    };
    const margin = 8;
    const safeLeft = viewportLeft + readSafeInset("--english-tts-safe-left") + margin;
    const safeRight = viewportLeft + viewportWidth - readSafeInset("--english-tts-safe-right") - margin;
    const safeTop = viewportTop + readSafeInset("--english-tts-safe-top") + margin;
    const safeBottom = viewportTop + viewportHeight - readSafeInset("--english-tts-safe-bottom") - margin;
    const availableWidth = Math.max(48, safeRight - safeLeft);
    button.style.minWidth = `${Math.min(144, availableWidth)}px`;
    button.style.maxWidth = `${availableWidth}px`;
    button.style.visibility = "hidden";
    const measuredButton = button.getBoundingClientRect();
    const buttonWidth = Math.min(measuredButton.width || 144, availableWidth);
    const buttonHeight = measuredButton.height || 52;
    const maxLeft = Math.max(safeLeft, safeRight - buttonWidth);
    const maxTop = Math.max(safeTop, safeBottom - buttonHeight);
    const clamp = (value, minimum, maximum) => Math.min(Math.max(value, minimum), maximum);
    const image = wrapper.querySelector("img");
    let panelRect = null;
    let speechRects = [];

    if (image) {
        const imageRect = image.getBoundingClientRect();
        if (imageRect.width > 0 && imageRect.height > 0) {
            const imageLeft = imageRect.left + viewportLeft;
            const imageTop = imageRect.top + viewportTop;
            const toRect = bounds => ({
                left: imageLeft + imageRect.width * bounds.xPct / 100,
                top: imageTop + imageRect.height * bounds.yPct / 100,
                right: imageLeft + imageRect.width * (bounds.xPct + bounds.widthPct) / 100,
                bottom: imageTop + imageRect.height * (bounds.yPct + bounds.heightPct) / 100
            });
            panelRect = toRect(panel.bounds);
            speechRects = panel.speechUnits.map(unit => toRect(unit.bounds));
        }
    }

    const panelMinLeft = panelRect ? Math.max(safeLeft, panelRect.left) : safeLeft;
    const panelMaxLeft = panelRect ? Math.min(maxLeft, panelRect.right - buttonWidth) : maxLeft;
    const panelCenterLeft = panelRect
        ? panelRect.left + (panelRect.right - panelRect.left - buttonWidth) / 2
        : viewportLeft + (viewportWidth - buttonWidth) / 2;
    const preferredLeft = panelMinLeft <= panelMaxLeft
        ? clamp(panelCenterLeft, panelMinLeft, panelMaxLeft)
        : clamp(panelCenterLeft, safeLeft, maxLeft);
    const leftCandidates = [preferredLeft, safeLeft, maxLeft];
    const topCandidates = panelRect
        ? [panelRect.bottom + 6, panelRect.top - buttonHeight - 6]
        : [];
    speechRects.forEach(rect => {
        leftCandidates.push(rect.left - buttonWidth - 4, rect.right + 4);
        topCandidates.push(rect.top - buttonHeight - 4, rect.bottom + 4);
    });
    [0.82, 0.65, 0.35, 0.18].forEach(ratio =>
        topCandidates.push(clamp(viewportTop + viewportHeight * ratio - buttonHeight / 2, safeTop, maxTop)));
    topCandidates.push(safeTop, maxTop);

    const overlapsSpeech = (left, top) => speechRects.some(rect =>
        left < rect.right && left + buttonWidth > rect.left &&
        top < rect.bottom && top + buttonHeight > rect.top);
    let placement = null;
    for (const top of topCandidates) {
        for (const left of leftCandidates) {
            if (left >= safeLeft && left + buttonWidth <= safeRight &&
                top >= safeTop && top + buttonHeight <= safeBottom && !overlapsSpeech(left, top)) {
                placement = { left, top };
                break;
            }
        }
        if (placement) {
            break;
        }
    }

    if (!placement) {
        button.hidden = true;
        button.style.visibility = "hidden";
        return false;
    }
    button.style.left = `${placement.left}px`;
    button.style.top = `${placement.top}px`;
    button.style.visibility = "visible";
    return true;
}

function updateEnglishTTSControls() {
    const voiceSelect = document.getElementById("english-tts-voice");
    const previewButton = document.getElementById("english-tts-preview");
    const speakButton = document.getElementById("english-tts-speak-selection");
    const stopButton = document.getElementById("english-tts-stop");
    const floatingStopButton = getEnglishTTSFloatingStopButton();
    const hasVoice = Boolean(getSelectedLocalEnglishVoice());
    const canSpeak = englishTTSState.supported && hasVoice && appState.subjectMode === "english";

    if (voiceSelect) {
        voiceSelect.disabled = !englishTTSState.supported || !englishTTSState.voices.length;
    }
    if (previewButton) {
        previewButton.disabled = !canSpeak;
    }
    if (speakButton) {
        speakButton.disabled = !canSpeak || !englishTTSState.lastSelectionText;
    }
    if (stopButton) {
        stopButton.disabled = !englishTTSState.activeUtterance &&
            !englishTTSState.collocationReplayTimer && !englishTTSState.storySequenceTimer &&
            !englishTTSState.dialogueSequenceTimer && !englishTTSState.answerSequenceTimer;
    }
    if (floatingStopButton) {
        const shouldShowStop = appState.subjectMode === "english" && isEnglishTTSPlaybackActive();
        const imageStopRow = englishTTSState.imageTTSStopRow ||
            floatingStopButton.closest(".english-tts-image-stop-row");
        if (shouldShowStop) {
            cancelEnglishTTSImageStopCleanup();
            floatingStopButton.hidden = false;
            positionEnglishTTSFloatingStopButton();
        } else if (imageStopRow) {
            if (!englishTTSState.imageTTSStopCleanupFrame) {
                const requestFrame = window.requestAnimationFrame || (callback => window.setTimeout(callback, 16));
                englishTTSState.imageTTSStopCleanupFrame = requestFrame(() => {
                    englishTTSState.imageTTSStopCleanupFrame = 0;
                    if (appState.subjectMode === "english" && isEnglishTTSPlaybackActive()) {
                        positionEnglishTTSFloatingStopButton();
                        return;
                    }
                    floatingStopButton.hidden = true;
                    clearEnglishTTSImageStopRow(floatingStopButton);
                    englishTTSState.activeSpeechIsImageTTS = false;
                    englishTTSState.activeImageTTSWrapper = null;
                    englishTTSState.activeImageTTSDialoguePanel = null;
                    englishTTSState.activeImageTTSStoryPanel = null;
                });
            }
        } else {
            cancelEnglishTTSImageStopCleanup();
            floatingStopButton.hidden = true;
            if (englishTTSState.imageTTSStopObserver) {
                englishTTSState.imageTTSStopObserver.disconnect();
                englishTTSState.imageTTSStopObserver = null;
            }
            englishTTSState.activeSpeechIsImageTTS = false;
            englishTTSState.activeImageTTSWrapper = null;
            englishTTSState.activeImageTTSDialoguePanel = null;
            englishTTSState.activeImageTTSStoryPanel = null;
            if (floatingStopButton.classList.contains("is-image-tts-dialogue-stop-control") ||
                floatingStopButton.classList.contains("is-image-tts-story-stop-control")) {
                resetEnglishTTSFloatingStopButtonStyles(floatingStopButton);
            }
        }
    }
}

function positionEnglishTTSFloatingStopButton() {
    const button = getEnglishTTSFloatingStopButton();
    if (!button || appState.subjectMode !== "english") {
        return;
    }

    const businessEmailStopPanel = englishTTSState.activeSpeechIsImageTTS
        ? getEnglishBusinessEmailStopPanel(
            englishTTSState.activeSpeechTrigger,
            englishTTSState.activeImageTTSWrapper
        )
        : null;
    if (businessEmailStopPanel) {
        if (!placeEnglishImageTTSDialogueStopButton(
            button,
            englishTTSState.activeImageTTSWrapper,
            businessEmailStopPanel
        )) {
            button.hidden = true;
        }
        return;
    }

    if (englishTTSState.activeImageTTSDialoguePanel) {
        if (!placeEnglishImageTTSDialogueStopButton(
            button,
            englishTTSState.activeImageTTSWrapper,
            englishTTSState.activeImageTTSDialoguePanel
        )) {
            button.hidden = true;
        }
        return;
    }

    if (englishTTSState.activeImageTTSStoryPanel) {
        placeEnglishImageTTSStoryStopButton(
            button,
            englishTTSState.activeImageTTSWrapper,
            englishTTSState.activeImageTTSStoryPanel
        );
        return;
    }

    if (englishTTSState.activeSpeechIsImageTTS) {
        placeEnglishImageTTSStopButton(button, englishTTSState.activeImageTTSWrapper);
        return;
    }

    if (button.hidden) {
        return;
    }
    clearEnglishTTSImageStopRow(button);

    // Keep non-image speech controls outside answer containers that may clip fixed descendants.
    if (button.parentNode !== document.body) {
        document.body.appendChild(button);
    }

    const viewport = window.visualViewport;
    const viewportLeft = viewport ? viewport.offsetLeft : 0;
    const viewportTop = viewport ? viewport.offsetTop : 0;
    const viewportWidth = viewport ? viewport.width : window.innerWidth;
    const viewportHeight = viewport ? viewport.height : window.innerHeight;
    const margin = 12;
    const gap = 10;
    const readSafeInset = name => {
        try {
            return parseFloat(window.getComputedStyle(button).getPropertyValue(name)) || 0;
        } catch (error) {
            return 0;
        }
    };
    const safeTop = readSafeInset("--english-tts-safe-top");
    const safeRight = readSafeInset("--english-tts-safe-right");
    const safeBottom = readSafeInset("--english-tts-safe-bottom");
    const safeLeft = readSafeInset("--english-tts-safe-left");
    const minLeft = viewportLeft + safeLeft + margin;
    const maxRight = viewportLeft + viewportWidth - safeRight - margin;
    const minTop = viewportTop + safeTop + margin;
    const maxBottom = viewportTop + viewportHeight - safeBottom - margin;

    button.style.visibility = "hidden";
    const availableWidth = Math.max(48, maxRight - minLeft);
    button.style.maxWidth = `${availableWidth}px`;
    const measured = button.getBoundingClientRect();
    const buttonWidth = Math.min(measured.width || 144, availableWidth);
    const buttonHeight = measured.height || 52;
    const maxLeft = Math.max(minLeft, maxRight - buttonWidth);
    const maxTop = Math.max(minTop, maxBottom - buttonHeight);
    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
    const place = (left, top) => {
        button.style.right = "auto";
        button.style.left = `${clamp(left, minLeft, maxLeft)}px`;
        button.style.top = `${clamp(top, minTop, maxTop)}px`;
        button.style.transform = "none";
        button.style.visibility = "visible";
    };
    const isAnchorVisible = rect => rect && rect.width > 0 && rect.height > 0 &&
        rect.right > viewportLeft + safeLeft && rect.left < viewportLeft + viewportWidth - safeRight &&
        rect.bottom > viewportTop + safeTop && rect.top < viewportTop + viewportHeight - safeBottom;

    let anchorRect = null;
    const trigger = englishTTSState.activeSpeechTrigger;
    if (trigger && trigger.isConnected !== false) {
        const isSelectionTrigger = trigger.id === "english-tts-speak-selection";
        let triggerIsVisible = false;
        try {
            const style = window.getComputedStyle(trigger);
            triggerIsVisible = style.display !== "none" && style.visibility !== "hidden";
        } catch (error) {
            triggerIsVisible = false;
        }

        if (triggerIsVisible) {
            try {
                const rect = trigger.getBoundingClientRect();
                if (rect && rect.width && rect.height) {
                    anchorRect = {
                        left: rect.left + (viewport ? viewport.offsetLeft : 0),
                        right: rect.right + (viewport ? viewport.offsetLeft : 0),
                        top: rect.top + (viewport ? viewport.offsetTop : 0),
                        bottom: rect.bottom + (viewport ? viewport.offsetTop : 0),
                        width: rect.width,
                        height: rect.height
                    };
                    englishTTSState.activeSpeechTriggerRect = {
                        ...anchorRect,
                        visualOffsetLeft: viewport ? viewport.offsetLeft : 0,
                        visualOffsetTop: viewport ? viewport.offsetTop : 0
                    };
                }
            } catch (error) {
                anchorRect = null;
            }
        }

        // The selection speaker may hide after playback starts; retain its last valid viewport position.
        if (!anchorRect && isSelectionTrigger && englishTTSState.activeSpeechTriggerRect) {
            const saved = englishTTSState.activeSpeechTriggerRect;
            const offsetLeftDelta = (viewport ? viewport.offsetLeft : 0) - (saved.visualOffsetLeft || 0);
            const offsetTopDelta = (viewport ? viewport.offsetTop : 0) - (saved.visualOffsetTop || 0);
            anchorRect = {
                left: saved.left + offsetLeftDelta,
                right: saved.right + offsetLeftDelta,
                top: saved.top + offsetTopDelta,
                bottom: saved.bottom + offsetTopDelta,
                width: saved.width,
                height: saved.height
            };
        }
    }

    if (isAnchorVisible(anchorRect)) {
        const alignedTop = clamp(
            anchorRect.top + (anchorRect.height - buttonHeight) / 2,
            minTop,
            maxTop
        );
        const rightLeft = anchorRect.right + gap;
        if (rightLeft + buttonWidth <= maxRight) {
            place(rightLeft, alignedTop);
            return;
        }

        const leftLeft = anchorRect.left - gap - buttonWidth;
        if (leftLeft >= minLeft) {
            place(leftLeft, alignedTop);
            return;
        }

        const belowTop = anchorRect.bottom + gap;
        const belowLeft = clamp(anchorRect.left + (anchorRect.width - buttonWidth) / 2, minLeft, maxLeft);
        if (belowTop + buttonHeight <= maxBottom) {
            place(belowLeft, belowTop);
            return;
        }

        const aboveTop = anchorRect.top - gap - buttonHeight;
        if (aboveTop >= minTop) {
            place(belowLeft, aboveTop);
            return;
        }

        // On very narrow screens, keep the control reachable even if a non-overlapping side is impossible.
        place(anchorRect.right <= viewportLeft + viewportWidth / 2 ? maxLeft : minLeft, alignedTop);
        return;
    }

    // A scrolled-out or removed trigger docks at a safe visible position until playback ends.
    const dockTops = [0.65, 0.35, 0.82, 0.18].map(ratio =>
        clamp(viewportTop + viewportHeight * ratio - buttonHeight / 2, minTop, maxTop)
    );
    const selectionButton = document.getElementById("english-tts-speak-selection");
    const panel = document.getElementById("english-tts-panel");
    const avoidRects = [];
    const addAvoidRect = element => {
        if (!element || (element === panel && element.hidden)) {
            return;
        }
        const rect = element.getBoundingClientRect();
        if (rect && rect.width && rect.height) {
            avoidRects.push({
                left: rect.left + (viewport ? viewport.offsetLeft : 0),
                right: rect.right + (viewport ? viewport.offsetLeft : 0),
                top: rect.top + (viewport ? viewport.offsetTop : 0),
                bottom: rect.bottom + (viewport ? viewport.offsetTop : 0)
            });
        }
    };
    if (selectionButton && selectionButton.classList.contains("is-floating") &&
        selectionButton.style.visibility !== "hidden") {
        addAvoidRect(selectionButton);
    }
    addAvoidRect(panel);
    const dockTop = dockTops.map(top => {
        const candidate = { left: maxLeft, right: maxLeft + buttonWidth, top, bottom: top + buttonHeight };
        const overlap = avoidRects.reduce((total, rect) => {
            const width = Math.max(0, Math.min(candidate.right, rect.right) - Math.max(candidate.left, rect.left));
            const height = Math.max(0, Math.min(candidate.bottom, rect.bottom) - Math.max(candidate.top, rect.top));
            return total + width * height;
        }, 0);
        return { top, overlap };
    }).sort((a, b) => a.overlap - b.overlap || a.top - b.top)[0].top;
    place(maxLeft, dockTop);
}

function refreshLocalEnglishVoices() {
    const voiceSelect = document.getElementById("english-tts-voice");
    if (!englishTTSState.supported || !voiceSelect) {
        updateEnglishTTSControls();
        return;
    }

    let availableVoices = [];
    try {
        availableVoices = englishTTSState.synthesis.getVoices();
    } catch (error) {
        availableVoices = [];
    }

    englishTTSState.voices = availableVoices
        .filter(voice => voice && voice.localService === true && /^en(?:-|$)/i.test(voice.lang || ""))
        .sort((a, b) => {
            const aScore = (/^en-US$/i.test(a.lang) ? 4 : 0) + (a.default ? 2 : 0);
            const bScore = (/^en-US$/i.test(b.lang) ? 4 : 0) + (b.default ? 2 : 0);
            return bScore - aScore || a.name.localeCompare(b.name);
        });

    while (voiceSelect.firstChild) {
        voiceSelect.removeChild(voiceSelect.firstChild);
    }

    if (!englishTTSState.voices.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "沒有可用的本機英文聲線";
        voiceSelect.appendChild(option);
        englishTTSState.selectedVoiceKey = "";
        updateEnglishTTSControls();
        setEnglishTTSStatus("找不到本機英文聲線。請在 iPad 設定中下載英文語音後重新載入；此功能不會使用遠端聲線。");
        return;
    }

    englishTTSState.voices.forEach(voice => {
        const option = document.createElement("option");
        option.value = getEnglishTTSVoiceKey(voice);
        option.textContent = `${voice.name} (${voice.lang})${voice.default ? " · 系統預設" : ""}`;
        voiceSelect.appendChild(option);
    });

    const preferredVoice = englishTTSState.voices.find(
        voice => getEnglishTTSVoiceKey(voice) === englishTTSState.preferredVoiceKey
    );
    const previouslySelected = englishTTSState.voices.find(
        voice => getEnglishTTSVoiceKey(voice) === englishTTSState.selectedVoiceKey
    );
    const fallbackVoice = englishTTSState.voices.find(voice => /^en-US$/i.test(voice.lang) && voice.default)
        || englishTTSState.voices.find(voice => /^en-US$/i.test(voice.lang))
        || englishTTSState.voices.find(voice => voice.default)
        || englishTTSState.voices[0];
    const selectedVoice = preferredVoice || previouslySelected || fallbackVoice;

    englishTTSState.selectedVoiceKey = getEnglishTTSVoiceKey(selectedVoice);
    voiceSelect.value = englishTTSState.selectedVoiceKey;
    updateEnglishTTSControls();

    if (!preferredVoice && englishTTSState.preferredVoiceKey) {
        setEnglishTTSStatus("原先選擇的聲線目前不可用，已改用本機英文聲線。可稍後重新載入查看聲線是否恢復。");
    } else {
        setEnglishTTSStatus("已載入本機英文聲線。請選取英文回答中的一段連續文字，再按朗讀。");
    }
}

function cancelEnglishCollocationReplay() {
    if (englishTTSState.collocationReplayTimer) {
        window.clearTimeout(englishTTSState.collocationReplayTimer);
        englishTTSState.collocationReplayTimer = 0;
    }
    englishTTSState.collocationReplayGeneration += 1;
}

function cancelEnglishAnswerTTSSequence(cancelCurrentUtterance = false) {
    const sequenceTrigger = englishTTSState.answerSequenceTrigger;
    const wasSelectionSequence = englishTTSState.answerSequenceType === "selection";
    const hadSequence = Boolean(sequenceTrigger || englishTTSState.answerSequenceTimer ||
        englishTTSState.answerSequenceType);
    if (englishTTSState.answerSequenceTimer) {
        window.clearTimeout(englishTTSState.answerSequenceTimer);
        englishTTSState.answerSequenceTimer = 0;
    }
    englishTTSState.answerSequenceGeneration += 1;
    englishTTSState.answerSequenceTrigger = null;
    englishTTSState.answerSequenceType = "";
    englishTTSState.answerSequenceSelectionText = "";

    if (cancelCurrentUtterance && hadSequence && englishTTSState.activeUtterance) {
        englishTTSState.activeUtterance = null;
        if (englishTTSState.activeSpeechTrigger === sequenceTrigger) {
            englishTTSState.activeSpeechTrigger = null;
            englishTTSState.activeSpeechTriggerRect = null;
        }
        if (englishTTSState.synthesis) {
            try {
                englishTTSState.synthesis.cancel();
            } catch (error) {
                // Keep the page usable even if the browser speech engine is unavailable.
            }
        }
    }
    if (cancelCurrentUtterance && hadSequence) {
        updateEnglishTTSControls();
    }
    if (wasSelectionSequence) {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed) {
            clearEnglishTTSSelection();
        }
    }
}

function cancelEnglishImageTTSStorySequence(cancelCurrentUtterance = false) {
    const sequenceTrigger = englishTTSState.storySequenceTrigger;
    const hadSequence = Boolean(sequenceTrigger || englishTTSState.storySequenceTimer);
    if (englishTTSState.storySequenceTimer) {
        window.clearTimeout(englishTTSState.storySequenceTimer);
        englishTTSState.storySequenceTimer = 0;
    }
    englishTTSState.storySequenceGeneration += 1;
    englishTTSState.storySequenceTrigger = null;

    if (cancelCurrentUtterance && hadSequence) {
        const hadActiveUtterance = Boolean(englishTTSState.activeUtterance);
        if (englishTTSState.activeSpeechTrigger === sequenceTrigger) {
            englishTTSState.activeSpeechTrigger = null;
            englishTTSState.activeSpeechTriggerRect = null;
        }
        if (englishTTSState.activeUtterance) {
            englishTTSState.activeUtterance = null;
        }
        if (hadActiveUtterance && englishTTSState.synthesis) {
            try {
                englishTTSState.synthesis.cancel();
            } catch (error) {
                // Keep the page usable even if the browser speech engine is unavailable.
            }
        }
    }
    updateEnglishTTSControls();
}

function cancelEnglishImageTTSDialogueSequence(cancelCurrentUtterance = false) {
    const sequenceTrigger = englishTTSState.dialogueSequenceTrigger;
    const hadSequence = Boolean(sequenceTrigger || englishTTSState.dialogueSequenceTimer);
    if (!hadSequence) {

            englishTTSState.activeSpeechTrigger = null;

        }

            englishTTSState.activeUtterance = null;
        }
        if (hadActiveUtterance && englishTTSState.synthesis) {

function cancelEnglishImageTTSStorySequenceForDifferentTrigger(trigger) {
    if (englishTTSState.storySequenceTrigger && englishTTSState.storySequenceTrigger !== trigger) {
        cancelEnglishImageTTSStorySequence(true);
        setEnglishTTSStatus("已切換圖片格，上一格的連續朗讀已停止。");
    }
}

function speakEnglishCollocationSequence(phrases) {
    const sequence = Array.isArray(phrases)
        ? phrases.map(phrase => getEnglishTTSUnitText(phrase)).filter(Boolean)
        : [];
    if (!sequence.length) {
        return false;
    }

    cancelEnglishCollocationReplay();
    const generation = englishTTSState.collocationReplayGeneration;
    let phraseIndex = 0;
    let playIndex = 0;

    const finishSequence = () => {
        if (generation !== englishTTSState.collocationReplayGeneration) {
            return;
        }
        cancelEnglishCollocationReplay();
        setEnglishTTSStatus("Common Collocations 搭配詞已朗讀完成。");
        updateEnglishTTSControls();
    };

    const playNext = () => {
        if (generation !== englishTTSState.collocationReplayGeneration || appState.subjectMode !== "english") {
            updateEnglishTTSControls();
            return false;
        }

        const phrase = sequence[phraseIndex];
        const started = speakEnglishText(phrase, () => {
            if (generation !== englishTTSState.collocationReplayGeneration || appState.subjectMode !== "english") {
                return;
            }

            if (playIndex === 0) {
                playIndex = 1;
            } else {
                playIndex = 0;
                phraseIndex += 1;
                if (phraseIndex >= sequence.length) {
                    finishSequence();
                    return;
                }
            }

            englishTTSState.collocationReplayTimer = window.setTimeout(() => {
                englishTTSState.collocationReplayTimer = 0;
                if (generation !== englishTTSState.collocationReplayGeneration || appState.subjectMode !== "english") {
                    updateEnglishTTSControls();
                    return;
                }
                playNext();
            }, 500);
            setEnglishTTSStatus("搭配詞依序朗讀中，兩次播放之間會短暫停頓。");
            updateEnglishTTSControls();
        }, true, () => {
            if (generation === englishTTSState.collocationReplayGeneration) {
                cancelEnglishCollocationReplay();
                setEnglishTTSStatus("搭配詞連續朗讀已停止。請重新點擊播放。");
                updateEnglishTTSControls();
            }
        });

        if (!started && generation === englishTTSState.collocationReplayGeneration) {
            cancelEnglishCollocationReplay();
            updateEnglishTTSControls();
        }
        return started;
    };

    return playNext();
}

function speakEnglishCollocationTwice(text) {
    return speakEnglishCollocationSequence([text]);
}

function speakEnglishText(
    text,
    onComplete = null,
    preserveCollocationReplay = false,
    onError = null,
    storySequenceGeneration = null,
    answerSequenceGeneration = null,
    dialogueSequenceGeneration = null
) {
    if (storySequenceGeneration === null) {
        cancelEnglishImageTTSStorySequence();
    } else if (storySequenceGeneration !== englishTTSState.storySequenceGeneration) {
        return false;
    }
    if (dialogueSequenceGeneration === null) {
        cancelEnglishImageTTSDialogueSequence();
    } else if (dialogueSequenceGeneration !== englishTTSState.dialogueSequenceGeneration) {
        return false;
    }
    if (answerSequenceGeneration === null) {
        const requestedSpeechTrigger = englishTTSState.activeSpeechTrigger;
        const requestedSpeechTriggerRect = englishTTSState.activeSpeechTriggerRect;
        cancelEnglishAnswerTTSSequence(true);
        if (requestedSpeechTrigger) {
            rememberEnglishSpeechTrigger(requestedSpeechTrigger);
            englishTTSState.activeSpeechTriggerRect = requestedSpeechTriggerRect;
        }
    } else if (answerSequenceGeneration !== englishTTSState.answerSequenceGeneration) {
        return false;
    }
    if (!preserveCollocationReplay) {
        cancelEnglishCollocationReplay();
    }
    if (appState.subjectMode !== "english") {
        setEnglishTTSStatus("請先切換至英文模式。");
        return false;
    }
    if (!englishTTSState.supported || !englishTTSState.synthesis) {
        setEnglishTTSStatus("此瀏覽器不支援語音合成。");
        return false;
    }

    const voice = getSelectedLocalEnglishVoice();
    if (!voice) {
        setEnglishTTSStatus("沒有可用的本機英文聲線，未開始朗讀。");
        updateEnglishTTSControls();
        return false;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.voice = voice;
    utterance.lang = voice.lang || "en-US";
    utterance.rate = englishTTSState.rate;
    utterance.onstart = () => {
        if (englishTTSState.activeUtterance === utterance) {
            setEnglishTTSStatus("正在朗讀英文…");
            updateEnglishTTSControls();
        }
    };
    utterance.onend = () => {
        if (englishTTSState.activeUtterance === utterance) {
            englishTTSState.activeUtterance = null;
            setEnglishTTSStatus("朗讀完成。");
            updateEnglishTTSControls();
            if (typeof onComplete === "function") {
                onComplete();
            }
            if (!englishTTSState.activeUtterance && !englishTTSState.collocationReplayTimer &&
                !englishTTSState.storySequenceTimer && !englishTTSState.dialogueSequenceTimer && !englishTTSState.answerSequenceTimer) {
                englishTTSState.activeSpeechTrigger = null;
                englishTTSState.activeSpeechTriggerRect = null;
            }
        }
    };
    utterance.onerror = event => {
        if (englishTTSState.activeUtterance === utterance) {
            englishTTSState.activeUtterance = null;
            const reason = event && event.error ? `（${event.error}）` : "";
            setEnglishTTSStatus(`語音播放失敗${reason}。請重新試聽或選擇其他聲線。`);
            updateEnglishTTSControls();
            if (typeof onError === "function") {
                onError(event);
            }
            if (!englishTTSState.activeUtterance && !englishTTSState.collocationReplayTimer &&
                !englishTTSState.storySequenceTimer && !englishTTSState.dialogueSequenceTimer && !englishTTSState.answerSequenceTimer) {
                englishTTSState.activeSpeechTrigger = null;
                englishTTSState.activeSpeechTriggerRect = null;
            }
        }
    };

    try {
        // Invalidate the previous utterance before cancel(): some engines may dispatch
        // its onend/onerror synchronously. Keep the newly recorded trigger intact.
        englishTTSState.activeUtterance = null;
        englishTTSState.synthesis.cancel();
        englishTTSState.activeUtterance = utterance;
        updateEnglishTTSControls();
        englishTTSState.synthesis.speak(utterance);
        return true;
    } catch (error) {
        englishTTSState.activeUtterance = null;
        englishTTSState.activeSpeechTrigger = null;
        englishTTSState.activeSpeechTriggerRect = null;
        setEnglishTTSStatus("無法開始語音播放。請確認裝置語音設定後再試一次。");
        updateEnglishTTSControls();
        return false;
    }
}

function stopEnglishSpeech() {
    cancelEnglishImageTTSStorySequence();
    cancelEnglishImageTTSDialogueSequence(true);
    cancelEnglishCollocationReplay();
    cancelEnglishAnswerTTSSequence();
    englishTTSState.activeUtterance = null;
    englishTTSState.activeSpeechTrigger = null;
    englishTTSState.activeSpeechTriggerRect = null;
    if (englishTTSState.synthesis) {
        try {
            englishTTSState.synthesis.cancel();
        } catch (error) {
            // Keep the page usable even if the browser speech engine is unavailable.
        }
    }
    updateEnglishTTSControls();
}

function speakEnglishAnswerSequence(trigger, text, sequenceType = "answer") {
    const safeText = getEnglishTTSUnitText(text);
    if (!safeText) {
        return speakEnglishText(text);
    }

    const segmentation = splitEnglishTTSSentences(safeText.replace(/[ \t]*\n[ \t]*/g, " "));
    const segmentedUnits = segmentation.reliable
        ? segmentation.sentences.map(sentence => getEnglishTTSUnitText(sentence))
        : [];
    const units = segmentedUnits.length > 1 && segmentedUnits.every(Boolean)
        ? segmentedUnits
        : [safeText];
    if (units.length === 1) {
        return speakEnglishText(safeText);
    }

    cancelEnglishImageTTSStorySequence(true);
    cancelEnglishCollocationReplay();
    cancelEnglishAnswerTTSSequence(true);
    if (trigger) {
        rememberEnglishSpeechTrigger(trigger);
    }

    const generation = englishTTSState.answerSequenceGeneration;
    englishTTSState.answerSequenceTrigger = trigger || null;
    englishTTSState.answerSequenceType = sequenceType;
    englishTTSState.answerSequenceSelectionText = sequenceType === "selection" ? safeText : "";
    let unitIndex = 0;

    const finishSequence = () => {
        if (generation !== englishTTSState.answerSequenceGeneration) {
            return;
        }
        cancelEnglishAnswerTTSSequence();
        setEnglishTTSStatus("AI 回答已朗讀完成。");
        updateEnglishTTSControls();
    };

    const playNext = () => {
        if (generation !== englishTTSState.answerSequenceGeneration) {
            return false;
        }
        if (appState.subjectMode !== "english" || (trigger && trigger.isConnected === false)) {
            cancelEnglishAnswerTTSSequence(true);
            updateEnglishTTSControls();
            return false;
        }

        const started = speakEnglishText(units[unitIndex], () => {
            if (generation !== englishTTSState.answerSequenceGeneration) {
                return;
            }
            if (appState.subjectMode !== "english" || (trigger && trigger.isConnected === false)) {
                cancelEnglishAnswerTTSSequence();
                updateEnglishTTSControls();
                return;
            }

            unitIndex += 1;
            if (unitIndex >= units.length) {
                finishSequence();
                return;
            }

            englishTTSState.answerSequenceTimer = window.setTimeout(() => {
                englishTTSState.answerSequenceTimer = 0;
                if (generation !== englishTTSState.answerSequenceGeneration) {
                    updateEnglishTTSControls();
                    return;
                }
                if (appState.subjectMode !== "english" || (trigger && trigger.isConnected === false)) {
                    cancelEnglishAnswerTTSSequence(true);
                    updateEnglishTTSControls();
                    return;
                }
                playNext();
            }, 500);
            setEnglishTTSStatus("AI 回答逐句朗讀中，句間停頓 0.5 秒。");
            updateEnglishTTSControls();
        }, true, () => {
            if (generation === englishTTSState.answerSequenceGeneration) {
                cancelEnglishAnswerTTSSequence();
                updateEnglishTTSControls();
            }
        }, null, generation);

        if (!started && generation === englishTTSState.answerSequenceGeneration) {
            cancelEnglishAnswerTTSSequence();
            updateEnglishTTSControls();
        }
        return started;
    };

    return playNext();
}

function normalizeEnglishTTSSelectionText(text) {
    return String(text)
        .replace(/\r\n?/g, "\n")
        .replace(/\u2011/g, "-")
        .replace(/[^\S\n]+/g, " ")
        .replace(/ *\n */g, "\n")
        .replace(/\n{3,}/g, "\n\n")
        .replace(/[ \t]+([,.;!?])/g, "$1")
        .trim();
}

function validateEnglishSelection(text) {
    const candidate = normalizeEnglishTTSSelectionText(text);
    if (!candidate) {
        return { valid: false, reason: "請先選取英文回答中的單字、片語或句子。" };
    }
    if ([...candidate].length > ENGLISH_TTS_MAX_SELECTION_CHARS) {
        return { valid: false, reason: `選取內容超過 ${ENGLISH_TTS_MAX_SELECTION_CHARS} 個字元。請分段選取一般教學段落後再朗讀。` };
    }
    const allowedEnglishText = /^[\p{Script=Latin}\p{M}\p{N}\s.,!?;:'"“”‘’()[\]{}\-–—…/]+$/u;
    if (!allowedEnglishText.test(candidate) || !/\p{Script=Latin}/u.test(candidate)) {
        return { valid: false, reason: "選取內容含有中文或非英文文字，為避免誤讀，已拒絕朗讀。" };
    }
    return { valid: true, text: candidate };
}

function extractEnglishRangeText(range) {
    if (!range || typeof range.cloneContents !== "function") {
        return { valid: false, reason: "無法讀取選取範圍，請重新選取英文文字。" };
    }

    let fragment;
    try {
        fragment = range.cloneContents();
    } catch (error) {
        return { valid: false, reason: "無法安全讀取這段選取內容，請重新選取英文文字。" };
    }

    const parts = [];
    let containsInterfaceText = false;
    const blockTags = new Set(["P", "DIV", "LI", "BLOCKQUOTE", "PRE", "H1", "H2", "H3", "H4", "H5", "H6"]);
    const forbiddenTags = new Set(["BUTTON", "INPUT", "SELECT", "TEXTAREA", "CANVAS", "SVG", "SCRIPT", "STYLE"]);

    function visit(node) {
        if (!node || containsInterfaceText) {
            return;
        }
        if (node.nodeType === 3) {
            parts.push(node.nodeValue || "");
            return;
        }
        if (node.nodeType === 11) {
            Array.from(node.childNodes || []).forEach(visit);
            return;
        }
        if (node.nodeType !== 1) {
            return;
        }

        const tagName = String(node.tagName || "").toUpperCase();
        if (typeof node.matches === "function" && node.matches("[data-english-tts-control='true']")) {
            return;
        }
        if (forbiddenTags.has(tagName) || (typeof node.matches === "function" &&
            node.matches("[hidden], [aria-hidden='true'], [role='button'], .english-tts-panel, #english-tts-speak-selection"))) {
            containsInterfaceText = true;
            return;
        }
        // Image alt text is metadata, not selected English answer text.
        if (tagName === "IMG") {
            return;
        }
        if (tagName === "BR") {
            parts.push("\n");
            return;
        }

        const isBlock = blockTags.has(tagName);
        if (isBlock) {
            parts.push("\n\n");
        }
        Array.from(node.childNodes || []).forEach(visit);
        if (isBlock) {
            parts.push("\n\n");
        }
    }

    visit(fragment);
    if (containsInterfaceText) {
        return { valid: false, reason: "選取範圍包含介面控制項或隱藏文字。請只選取英文回答內容。" };
    }
    return validateEnglishSelection(parts.join(""));
}

function protectEnglishTTSAbbreviationPeriods(text) {
    const marker = "\uE000";
    const protectedText = String(text)
        .replace(/\b(?:e\.g|i\.e|U\.S|U\.K|a\.m|p\.m)\./gi, match =>
            match.replace(/\.(?=[A-Za-z])/g, marker))
        .replace(/\b(?:Mr|Mrs|Ms|Dr|Prof)\.(?=\s+[A-Z])/gi, match => match.replace(/\./g, marker))
        .replace(/(\d)\.(?=\d)/g, `$1${marker}`);
    return { text: protectedText, marker };
}

function splitEnglishTTSSentences(text) {
    const protectedValue = protectEnglishTTSAbbreviationPeriods(text);
    let rawSegments = [];
    let usedIntlSegmenter = false;

    if (typeof Intl !== "undefined" && typeof Intl.Segmenter === "function") {
        try {
            rawSegments = Array.from(
                new Intl.Segmenter("en", { granularity: "sentence" }).segment(protectedValue.text),
                item => item.segment
            );
            usedIntlSegmenter = rawSegments.length > 0;
        } catch (error) {
            rawSegments = [];
        }
    }

    if (!rawSegments.length) {
        const source = protectedValue.text;
        const abbreviationContinuation = new RegExp(
            `(?:e${protectedValue.marker}g|i${protectedValue.marker}e|U${protectedValue.marker}S|U${protectedValue.marker}K|a${protectedValue.marker}m|p${protectedValue.marker}m)\\.$`,
            "i"
        );
        let start = 0;
        let index = 0;
        while (index < source.length) {
            if (source[index] === protectedValue.marker) {
                index += 1;
                continue;
            }
            if (!".!?".includes(source[index])) {
                index += 1;
                continue;
            }

            let end = index + 1;
            while (end < source.length && ".!?".includes(source[end])) {
                end += 1;
            }
            while (end < source.length && "\"'”’)]}".includes(source[end])) {
                end += 1;
            }
            if (source[index] === "." && abbreviationContinuation.test(source.slice(start, end))) {
                let nextTextIndex = end;
                while (nextTextIndex < source.length && /\s/.test(source[nextTextIndex])) {
                    nextTextIndex += 1;
                }
                if (nextTextIndex < source.length && /[a-z]/.test(source[nextTextIndex])) {
                    index = end;
                    continue;
                }
            }
            if (end === source.length || /\s/.test(source[end])) {
                rawSegments.push(source.slice(start, end));
                start = end;
                while (start < source.length && /\s/.test(source[start])) {
                    start += 1;
                }
                index = start;
            } else {
                index = end;
            }
        }
        if (start < source.length) {
            rawSegments.push(source.slice(start));
        }
        if (!rawSegments.length && source.trim()) {
            rawSegments.push(source);
        }
    }

    const sentences = rawSegments
        .map(segment => segment.split(protectedValue.marker).join("."))
        .map(segment => normalizeEnglishTTSSelectionText(segment))
        .filter(Boolean);
    return {
        sentences,
        reliable: sentences.length > 0,
        usedIntlSegmenter
    };
}

function splitEnglishTTSTokensAtParagraphBreaks(tokens, owner) {
    const blocks = [];
    let current = [];

    function flush() {
        if (current.some(token => token.type === "text" && token.text.trim())) {
            blocks.push({ owner, tokens: current });
        }
        current = [];
    }

    for (let index = 0; index < tokens.length;) {
        if (tokens[index].type === "br") {
            let end = index + 1;
            while (end < tokens.length && tokens[end].type === "br") {
                end += 1;
            }
            if (end - index >= 2) {
                flush();
                index = end;
                continue;
            }
        }
        current.push(tokens[index]);
        index += 1;
    }
    flush();
    return blocks;
}

function collectEnglishTTSBlocks(root) {
    const blocks = [];
    const blockTags = new Set(["P", "DIV", "LI", "BLOCKQUOTE", "PRE", "UL", "OL"]);
    const skippedTags = new Set(["H1", "H2", "H3", "H4", "H5", "H6", "IMG", "BUTTON", "INPUT", "SELECT", "TEXTAREA", "CANVAS", "SVG", "SCRIPT", "STYLE"]);

    function walkContainer(container) {
        const flowTokens = [];

        function flushFlow() {
            blocks.push(...splitEnglishTTSTokensAtParagraphBreaks(flowTokens.splice(0), container));
        }

        function visit(node) {
            if (!node) {
                return;
            }
            if (node.nodeType === 3) {
                flowTokens.push({ type: "text", node, text: node.nodeValue || "" });
                return;
            }
            if (node.nodeType !== 1) {
                return;
            }

            const tagName = String(node.tagName || "").toUpperCase();
            if (typeof node.matches === "function" && node.matches("[data-english-tts-control='true']")) {
                flushFlow();
                return;
            }
            if (/^H[1-6]$/.test(tagName)) {
                flushFlow();
                const headingTokens = [];
                const collectHeadingText = headingNode => {
                    if (headingNode.nodeType === 3) {
                        headingTokens.push({ type: "text", node: headingNode, text: headingNode.nodeValue || "" });
                        return;
                    }
                    if (headingNode.nodeType !== 1 ||
                        (typeof headingNode.matches === "function" &&
                            headingNode.matches("[data-english-tts-control='true'], [hidden], [aria-hidden='true'], [role='button']"))) {
                        return;
                    }
                    Array.from(headingNode.childNodes || []).forEach(collectHeadingText);
                };
                collectHeadingText(node);
                if (headingTokens.length) {
                    blocks.push({ owner: container, tokens: headingTokens, headingOnly: true });
                }
                flushFlow();
                return;
            }
            if (skippedTags.has(tagName) || (typeof node.matches === "function" &&
                node.matches("[hidden], [aria-hidden='true'], [role='button']"))) {
                flushFlow();
                return;
            }
            if (tagName === "BR") {
                flowTokens.push({ type: "br", node });
                return;
            }
            if (blockTags.has(tagName)) {
                flushFlow();
                walkContainer(node);
                return;
            }
            Array.from(node.childNodes || []).forEach(visit);
        }

        Array.from(container.childNodes || []).forEach(visit);
        flushFlow();
    }

    walkContainer(root);
    return blocks;
}

function englishTTSTokensToText(tokens) {
    return tokens.map(token => token.type === "br" ? "\n" : token.text).join("");
}

function splitEnglishTTSTokensAtLineBreaks(tokens) {
    const lines = [];
    let current = [];
    tokens.forEach(token => {
        if (token.type === "br") {
            if (current.length) {
                lines.push(current);
                current = [];
            }
        } else {
            current.push(token);
        }
    });
    if (current.length) {
        lines.push(current);
    }
    return lines;
}

function getEnglishTTSUnitText(text) {
    const candidate = normalizeEnglishTTSSelectionText(text);
    const allowedEnglishText = /^[\p{Script=Latin}\p{M}\p{N}\s.,!?;:'"“”‘’()[\]{}\-–—…/%]+$/u;
    if (!candidate || !allowedEnglishText.test(candidate) ||
        candidate.replace(/\p{N}%/gu, '').includes('%') || !/\p{Script=Latin}/u.test(candidate)) {
        return null;
    }

    return candidate;
}

function classifyEnglishTTSUnit(text) {
    const normalized = getEnglishTTSUnitText(text);
    if (!normalized) {
        return null;
    }

    const words = normalized.match(/[A-Za-zÀ-ÖØ-öø-ÿ]+(?:['’][A-Za-zÀ-ÖØ-öø-ÿ]+)*(?:-[A-Za-zÀ-ÖØ-öø-ÿ]+)*/g) || [];
    const hasEndingPunctuation = /[.!?]["'”’)]*$/.test(normalized);
    if (words.length === 1 && /^[\p{Script=Latin}\p{M}0-9'’\-]+[.!?]?["'”’)]*$/u.test(normalized)) {
        return { kind: "word", text: normalized, sentences: [normalized] };
    }
    if (words.length >= 2 && words.length <= 8 && !hasEndingPunctuation && normalized.length <= 90) {
        return { kind: "phrase", text: normalized, sentences: [normalized] };
    }

    // A BR may be a display line break inside one sentence. Use whitespace for
    // sentence boundaries while keeping the original text for paragraph speech.
    const segmentation = splitEnglishTTSSentences(normalized.replace(/[ \t]*\n[ \t]*/g, " "));
    if (segmentation.sentences.length > 1 && segmentation.reliable) {
        return { kind: "paragraph", text: normalized, sentences: segmentation.sentences };
    }
    if (!hasEndingPunctuation && words.length > 8) {
        return { kind: "paragraph", text: normalized, sentences: [] };
    }
    return { kind: "sentence", text: normalized, sentences: [normalized] };
}

function createEnglishTTSAutoButton(label, ariaLabel, speechText, onSpeak = null) {
    const button = document.createElement("button");

    button.setAttribute("data-english-tts-control", "true");
    button.setAttribute("aria-label", ariaLabel);
    button.textContent = label;
    button._englishTtsText = speechText;
    button.addEventListener("click", () => {
        rememberEnglishSpeechTrigger(button);
        if (typeof onSpeak === "function") {
            onSpeak(button._englishTtsText, button);
        } else {
            speakEnglishText(button._englishTtsText);
        }
    });
    return button;
}

function createEnglishTTSParagraphControls(unit, options = {}) {
    const controls = document.createElement("span");
    controls.className = "english-tts-auto-controls";
    controls.setAttribute("data-english-tts-control", "true");
    controls.setAttribute("role", "group");
    controls.setAttribute("aria-label", "段落英文朗讀控制");
    controls.appendChild(createEnglishTTSAutoButton(
        "🔊 朗讀整段",
        "朗讀整段英文",
        unit.text,
        (text, button) => speakEnglishAnswerSequence(button, text, "answer")
    ));

    if (unit.sentences.length > 1 || options.alwaysShowSentenceToggle) {
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "english-tts-auto-control";
        toggle.setAttribute("data-english-tts-control", "true");
        toggle.setAttribute("aria-expanded", "false");
        toggle.textContent = "單句";

        const sentenceControls = document.createElement("span");
        sentenceControls.className = "english-tts-auto-sentences";
        sentenceControls.setAttribute("data-english-tts-control", "true");
        sentenceControls.hidden = true;

        toggle.addEventListener("click", () => {
            if (sentenceControls.hidden) {
                if (sentenceControls.dataset.ready !== "true") {
                    unit.sentences.forEach((sentence, index) => {
                        sentenceControls.appendChild(createEnglishTTSAutoButton(
                            `🔊 第 ${index + 1} 句`,
                            `朗讀第 ${index + 1} 句英文`,
                            sentence
                        ));
                    });
                    sentenceControls.dataset.ready = "true";
                }
                sentenceControls.hidden = false;
                toggle.setAttribute("aria-expanded", "true");
            } else {
                sentenceControls.hidden = true;
                toggle.setAttribute("aria-expanded", "false");
            }
        });

        controls.appendChild(toggle);
        controls.appendChild(sentenceControls);
    }
    return controls;
}

function insertEnglishTTSControlAfterBlock(block, control, lastToken) {
    const node = lastToken.node;
    if (!node || !node.parentNode) {
        return false;
    }
    if (lastToken.type === "br") {
        node.parentNode.insertBefore(control, node.nextSibling);
        return true;
    }

    let anchor = node;
    while (anchor && anchor.parentNode !== block.owner) {
        anchor = anchor.parentNode;
    }
    if (!anchor || anchor.parentNode !== block.owner) {
        return false;
    }
    block.owner.insertBefore(control, anchor.nextSibling);
    return true;
}

function addEnglishTTSControlForTokens(block, tokens, unit, options = {}) {
    if (!unit || !tokens.length) {
        return false;
    }
    let control;
    if (unit.kind === "paragraph") {
        control = createEnglishTTSParagraphControls(unit, options);
    } else {
        const labels = {
            word: "朗讀英文單字",
            phrase: "朗讀英文片語",
            sentence: "朗讀英文句子"
        };
        control = createEnglishTTSAutoButton("🔊", labels[unit.kind], unit.text);
    }
    return insertEnglishTTSControlAfterBlock(block, control, tokens[tokens.length - 1]);
}

function normalizeEnglishTTSHeading(text) {
    return String(text)
        .replace(/^\s*(?:(?:[①②③④⑤⑥⑦⑧⑨⑩])|(?:\d{1,2}[.)]))\s*/, "")
        .trim();
}

function isEnglishDefinitionHeading(text) {
    return /^English\s+Definition\s*[:：]?$/i.test(normalizeEnglishTTSHeading(text));
}

function isEnglishTTSSectionHeading(text) {
    const heading = normalizeEnglishTTSHeading(text);
    return isEnglishDefinitionHeading(heading) ||
        isEnglishCollocationsHeading(heading) ||
        /^(?:Example(?:\s+Sentences)?|GEPT\s+Common(?:\s*\/\s*Exam\s+Meanings)?|Part\s+of\s+Speech|KK\s+Phonetic\s+Transcription)\s*[:：]?$/i.test(heading);
}

function enhanceEnglishAnswerForTTS(answerRoot) {
    if (!answerRoot || appState.subjectMode !== "english" || !englishTTSState.supported ||
        answerRoot.dataset.englishTtsEnhanced === "true") {
        return 0;
    }
    answerRoot.dataset.englishTtsEnhanced = "true";
    let added = 0;

    const blocks = collectEnglishTTSBlocks(answerRoot);
    const blockLines = blocks.map(block => ({
        block,
        lines: splitEnglishTTSTokensAtLineBreaks(block.tokens).map(tokens => ({
            block,
            tokens,
            text: englishTTSTokensToText(tokens)
        }))
    }));
    const allLines = blockLines.flatMap(item => item.lines);
    const handledLines = new Set();

    // Treat the definition heading and its following English-only lines as one unit.
    // Stop at the next known section heading so definitions never absorb collocations or examples.
    for (let index = 0; index < allLines.length; index += 1) {
        if (!isEnglishDefinitionHeading(allLines[index].text)) {
            continue;
        }

        const definitionBodyLines = [];
        const definitionLines = [];
        let nextIndex = index + 1;
        while (nextIndex < allLines.length && !isEnglishTTSSectionHeading(allLines[nextIndex].text)) {
            if (allLines[nextIndex].text.trim()) {
                const line = allLines[nextIndex];
                definitionBodyLines.push(line);
                // A separate Chinese translation belongs to the section visually but not to
                // its spoken definition. Mixed English/Chinese lines remain conservatively excluded.
                if (getEnglishTTSUnitText(line.text)) {
                    definitionLines.push(line);
                }
            }
            nextIndex += 1;
        }

        if (definitionLines.length) {
            const definitionText = getEnglishTTSUnitText(
                definitionLines.map(line => line.text).join("\n")
            );
            if (definitionText) {
                const segmentation = splitEnglishTTSSentences(
                    definitionText.replace(/[ \t]*\n[ \t]*/g, " ")
                );
                const unit = {
                    kind: "paragraph",
                    text: definitionText,
                    sentences: segmentation.sentences.length ? segmentation.sentences : [definitionText]
                };
                const lastLine = definitionLines[definitionLines.length - 1];
                if (addEnglishTTSControlForTokens(
                    lastLine.block,
                    lastLine.tokens,
                    unit,
                    { alwaysShowSentenceToggle: true }
                )) {
                    handledLines.add(allLines[index]);
                    definitionBodyLines.forEach(line => handledLines.add(line));
                    added += 1;
                }
            }
        }
        index = nextIndex - 1;
    }

    // Scan contiguous English-only lines independently. A bilingual translation line must
    // break the run, not invalidate the surrounding English examples and later sections.
    blockLines.forEach(({ block, lines }) => {
        let run = [];
        const flushRun = () => {
            if (!run.length) {
                return;
            }
            const runText = run.map(line => line.text).join("\n");
            const unit = classifyEnglishTTSUnit(runText);
            if (unit) {
                const lineUnits = run.map(line => ({
                    ...line,
                    unit: classifyEnglishTTSUnit(line.text)
                }));
                const separatedShortItems = lineUnits.length > 1 &&
                    lineUnits.every(item => item.unit && (item.unit.kind === "word" || item.unit.kind === "phrase"));

                if (separatedShortItems) {
                    lineUnits.forEach(item => {
                        if (addEnglishTTSControlForTokens(item.block, item.tokens, item.unit)) {
                            added += 1;
                        }
                    });
                } else {
                    const lastLine = run[run.length - 1];
                    if (addEnglishTTSControlForTokens(lastLine.block, lastLine.tokens, unit)) {
                        added += 1;
                    }
                }
            }
            run = [];
        };

        lines.forEach(line => {
            if (line.block.headingOnly || handledLines.has(line) || isEnglishTTSSectionHeading(line.text)) {
                flushRun();
                return;
            }
            if (classifyEnglishTTSUnit(line.text)) {
                run.push(line);
            } else {
                flushRun();
            }
        });
        flushRun();
    });

    return added;
}

function parseEnglishCollocationLine(text) {
    const match = String(text).match(/^\s*(?:[①②③④⑤⑥⑦⑧⑨⑩]|[1-9]\d{0,1}[.)])\s+(.+?)\s+(?:—|–|-)\s+(.+?)\s*$/u);
    if (!match || !/\p{Script=Han}/u.test(match[2])) {
        return null;
    }

    const phrase = getEnglishTTSUnitText(match[1]);
    if (!phrase || phrase.split(/\s+/).length > 12) {
        return null;
    }
    return { phrase };
}

function isEnglishCollocationsHeading(text) {
    return /^\s*Common Collocations\s*[:：]?\s*$/i.test(text);
}

function isEnglishCollocationsSectionEnd(text) {
    return /^\s*(?:Example Sentences\b|(?:\d+[.)]\s*)?GEPT Common\b|(?:\d+[.)]\s*)?Part of Speech\b|(?:\d+[.)]\s*)?KK Phonetic Transcription\b)/i.test(text);
}

function enhanceEnglishCollocationsForTTS(answerRoot) {
    if (!answerRoot || appState.subjectMode !== "english" || !englishTTSState.supported ||
        answerRoot.dataset.englishCollocationsTtsEnhanced === "true") {
        return 0;
    }
    answerRoot.dataset.englishCollocationsTtsEnhanced = "true";

    const sections = [];
    let currentSection = null;
    let added = 0;
    collectEnglishTTSBlocks(answerRoot).forEach(block => {
        splitEnglishTTSTokensAtLineBreaks(block.tokens).forEach(lineTokens => {
            const lineText = englishTTSTokensToText(lineTokens).trim();
            if (isEnglishCollocationsHeading(lineText)) {
                currentSection = { heading: { block, lastToken: lineTokens[lineTokens.length - 1] }, items: [] };
                sections.push(currentSection);
                return;
            }
            if (!currentSection || !lineText) {
                return;
            }
            if (isEnglishCollocationsSectionEnd(lineText)) {
                currentSection = null;
                return;
            }

            const collocation = parseEnglishCollocationLine(lineText);
            if (!collocation || !lineTokens.length) {
                return;
            }
            currentSection.items.push({ block, lastToken: lineTokens[lineTokens.length - 1], phrase: collocation.phrase });
        });
    });

    sections.forEach(section => {
        const phrases = section.items.map(item => item.phrase);
        if (!phrases.length || !section.heading.lastToken) {
            return;
        }

        // Keep one answer-scoped snapshot for both the heading control and row controls.
        section.phrases = phrases.slice();
        const sequenceButton = createEnglishTTSAutoButton(
            "🔊",
            "依序朗讀所有 Common Collocations 搭配詞",
            "",
            () => speakEnglishCollocationSequence(section.phrases)
        );
        sequenceButton.classList.add("english-tts-collocation-sequence");
        if (insertEnglishTTSControlAfterBlock(section.heading.block, sequenceButton, section.heading.lastToken)) {
            answerRoot._englishCollocationSections = answerRoot._englishCollocationSections || [];
            answerRoot._englishCollocationSections.push(section.phrases);
            added += 1;
        }

        section.items.forEach(item => {
            const button = createEnglishTTSAutoButton(
                "🔊",
                `朗讀搭配詞：${item.phrase}`,
                item.phrase,
                speakEnglishCollocationTwice
            );
            if (insertEnglishTTSControlAfterBlock(item.block, button, item.lastToken)) {
                added += 1;
            }
        });
    });

    return added;
}

function wrapEnglishImageForTTS(image) {
    if (!image || !image.parentNode) {
        return null;
    }
    if (image.parentElement && image.parentElement.classList.contains("image-tts-overlay-wrapper")) {
        return image.parentElement;
    }

    const wrapper = document.createElement("div");
    wrapper.className = "image-tts-overlay-wrapper";
    wrapper.style.position = "relative";
    wrapper.style.display = "block";
    wrapper.style.width = "100%";
    wrapper.style.maxWidth = "1200px";
    wrapper.style.margin = "0 auto 20px";

    image.parentNode.insertBefore(wrapper, image);
    wrapper.appendChild(image);
    // Move the original spacing to the wrapper so the image keeps its original
    // width, max-width, aspect ratio, border radius, and gap from following content.
    image.style.display = "block";
    image.style.width = "100%";
    image.style.maxWidth = "1200px";
    image.style.height = "auto";
    image.style.margin = "0 auto";

    return wrapper;
}

function createEnglishImageTTSDialoguePanelHitArea(wrapper, image, panel, tapRegion = null) {

    button.type = "button";
    button.className = "image-tts-dialogue-panel-hit-area";
    button.textContent = "";
    button.hidden = true;

    button._englishImageTTSDialoguePanel = panel;
    button._englishImageTTSIsTapRegion = isTapRegion;
    button._englishImageTTSMenuImage = image;
    button.addEventListener("click", event => {

        if (button.disabled || appState.subjectMode !== "english" || isEnglishImageTTSDrawingMode()) {
            return;
        }
        const activeTrigger = englishImageTTSOverlayState.activeTrigger;
        const activeMenu = englishImageTTSOverlayState.menu;
        const activePanel = activeTrigger && activeTrigger._englishImageTTSDialoguePanel;
        if (isTapRegion && activeTrigger && activeTrigger._englishImageTTSIsTapRegion &&
            activeMenu && !activeMenu.hidden && activePanel && activePanel.panelId === panel.panelId &&
            activeTrigger.closest(".image-tts-overlay-wrapper") === wrapper) {
            if (activeTrigger === button) {
                closeEnglishImageTTSMenu();
                return;
            }
            activeTrigger.setAttribute("aria-expanded", "false");
            button.setAttribute("aria-expanded", "true");
            englishImageTTSOverlayState.activeTrigger = button;
            return;
        }
        if (activeTrigger === button && activeMenu && !activeMenu.hidden) {
            closeEnglishImageTTSMenu();
            return;
        }

        const imageRect = image.getBoundingClientRect();
        let xPct;
        let yPct;
        if (event.detail === 0 || !imageRect.width || !imageRect.height) {
            xPct = panel.bounds.xPct + panel.bounds.widthPct / 2;
            yPct = panel.bounds.yPct + panel.bounds.heightPct / 2;
        } else {
            xPct = (event.clientX - imageRect.left) / imageRect.width * 100;
            yPct = (event.clientY - imageRect.top) / imageRect.height * 100;
        }
        if (!Number.isFinite(xPct) || !Number.isFinite(yPct)) {
            xPct = panel.bounds.xPct + panel.bounds.widthPct / 2;
            yPct = panel.bounds.yPct + panel.bounds.heightPct / 2;
        }
        button._englishImageTTSMenuPointPct = {
            xPct: Math.min(100, Math.max(0, xPct)),
            yPct: Math.min(100, Math.max(0, yPct))
        };
        openEnglishImageTTSMenu(button, panel);
    });

    wrapper.appendChild(button);
    return button;
}

function layoutEnglishImageTTSDialoguePanelHitAreas(wrapper) {
